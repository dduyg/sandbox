<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NAMEDROP</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>
body{font-family:Arial;background:#f5f5ff;margin:0;padding:0}
.container{max-width:900px;margin:auto;padding:20px}
.card{background:white;padding:10px;margin:10px 0;border:1px solid #ddd;cursor:pointer}
button{padding:6px 10px;margin:3px}
input{padding:6px;width:100%;margin:5px 0}
#loginBox{background:#fff;padding:20px;border:1px solid #ddd;margin-bottom:20px}
.hidden{display:none}
</style>
</head>

<body>

<div class="container">

<!-- LOGIN -->
<div id="loginBox">
  <h3>Login</h3>
  <input id="email" placeholder="Email"/>
  <button onclick="login()">Send Magic Link</button>
  <button onclick="logout()">Logout</button>
  <div id="userInfo"></div>
</div>

<!-- ADD FORM -->
<div id="app" class="hidden">

  <h2>Namedrop</h2>

  <input id="title" placeholder="Title"/>
  <input id="category" placeholder="Category"/>
  <input id="mood" placeholder="Mood"/>
  <input id="style" placeholder="Style"/>
  <input id="tags" placeholder="tags comma separated"/>

  <button onclick="save()">Save</button>
  <button onclick="resetForm()">Clear</button>

  <h3>Entries</h3>
  <div id="list"></div>

</div>

</div>

<script>
const supabase = window.supabase.createClient(
  "https://zsiilkcothfqtdmazbds.supabase.co",
  "sb_publishable_2g6DAgmpVToaCGIqUfQivg_416bQvVy"
);

let editingId = null;
let sessionUser = null;

/* AUTH */
async function login(){
  const email = document.getElementById("email").value;

  const { error } = await supabase.auth.signInWithOtp({
    email
  });

  if(error) return alert(error.message);
  alert("Check your email for login link");
}

async function logout(){
  await supabase.auth.signOut();
  location.reload();
}

supabase.auth.onAuthStateChange((_event, session)=>{
  sessionUser = session?.user || null;

  if(sessionUser){
    document.getElementById("app").classList.remove("hidden");
    document.getElementById("userInfo").innerText =
      "Logged in: " + sessionUser.email;
    load();
    subscribeRealtime();
  } else {
    document.getElementById("app").classList.add("hidden");
  }
});

/* CRUD */
async function save(){

  if(!sessionUser){
    alert("Login required");
    return;
  }

  const data = {
    title: title.value,
    category: category.value,
    mood: mood.value,
    style: style.value,
    tags: tags.value.split(",").map(t=>t.trim()),
    added: Date.now()
  };

  if(editingId){
    await supabase.from("namedrop_entries")
      .update(data)
      .eq("id", editingId);
    editingId = null;
  } else {
    await supabase.from("namedrop_entries")
      .insert([data]);
  }

  resetForm();
  load();
}

function edit(item){
  editingId = item.id;
  title.value = item.title;
  category.value = item.category;
  mood.value = item.mood;
  style.value = item.style;
  tags.value = (item.tags || []).join(",");
}

/* LOAD */
async function load(){
  const { data } = await supabase
    .from("namedrop_entries")
    .select("*")
    .order("added",{ascending:false});

  render(data || []);
}

/* DELETE */
async function del(id){
  await supabase
    .from("namedrop_entries")
    .delete()
    .eq("id", id);

  load();
}

/* RENDER */
function render(items){
  const list = document.getElementById("list");
  list.innerHTML = "";

  items.forEach(i=>{
    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <b>${i.title}</b><br/>
      ${i.category} | ${i.mood}<br/>
      <small>${(i.tags||[]).join(", ")}</small><br/>
      <button onclick='edit(${JSON.stringify(i)})'>Edit</button>
      <button onclick='del(${i.id})'>Delete</button>
    `;

    list.appendChild(div);
  });
}

/* REALTIME */
function subscribeRealtime(){
  supabase.channel("namedrop-live")
  .on(
    "postgres_changes",
    { event: "*", schema: "public", table: "namedrop_entries" },
    () => load()
  )
  .subscribe();
}

/* RESET */
function resetForm(){
  title.value = "";
  category.value = "";
  mood.value = "";
  style.value = "";
  tags.value = "";
}

/* SESSION CHECK */
supabase.auth.getSession().then(({data})=>{
  if(data.session){
    sessionUser = data.session.user;
    document.getElementById("app").classList.remove("hidden");
    load();
    subscribeRealtime();
  }
});
</script>

</body>
</html>
