<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ＮＡＭＥＤＲＯ🪭Ｐ</title>
<link href="https://fonts.cdnfonts.com/css/dellmonte-sans" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Orbitron:wght@400;700;900&family=Noto+Serif+JP:wght@300;400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg:      #f6f1ff;
  --bg2:     rgba(255,255,255,0.65);
  --bg3:     #ffffff;
  --amber:   #ff6ec7;
  --amber2:  #8a5cff;
  --rust:    #ff7aa2;
  --sage:    #4dd6b6;
  --slate:   #7aa0ff;
  --text:    #2b2b3a;
  --muted:   #6b6f8a;
  --border:  rgba(138,92,255,0.18);
  --border2: rgba(57,213,255,0.10);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Space Mono', monospace;
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  background: linear-gradient(135deg, #f6f1ff 0%, #fdf2ff 25%, #eaf7ff 50%, #fff0f6 75%, #f6f1ff 100%);
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: radial-gradient(circle, rgba(255,110,199,0.10) 1px, transparent 1px), radial-gradient(circle, rgba(57,213,255,0.08) 1px, transparent 1px);
  background-size: 28px 28px, 36px 36px;
  pointer-events: none;
  z-index: 0;
}

.container {
  position: relative;
  z-index: 1;
  max-width: 1300px;
  margin: 0 auto;
  padding: 0 28px;
}

/* ── HEADER ── */

header {
  padding: 52px 0 36px;
  text-align: center;
  border-bottom: 1px solid var(--border2);
  margin-bottom: 36px;
}

.header-eyebrow {
  font-family: 'Noto Serif JP', serif;
  font-size: 11px;
  letter-spacing: 6px;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 12px;
  opacity: 0.8;
}

.header-title {
  font-family: 'Dellmonte Sans', sans-serif;
  font-size: clamp(28px, 5vw, 56px);
  font-weight: 900;
  letter-spacing: 8px;
  color: var(--amber);
  line-height: 1;
  margin-bottom: 8px;
}

.header-sub {
  font-family: 'Noto Serif JP', serif;
  font-size: 13px;
  letter-spacing: 4px;
  color: var(--muted);
  margin-bottom: 20px;
}

.header-stats {
  display: flex;
  justify-content: center;
  gap: 32px;
  margin-bottom: 15px;
}

.stat-pill {
  font-size: 11px;
  letter-spacing: 2px;
  color: var(--muted);
}

.stat-pill .val {
  color: var(--amber);
  font-weight: 700;
}

/* ── SEARCH ── */

.search-section {
  padding-bottom: 30px;
}

.search-wrap {
  position: relative;
  max-width: 560px;
  margin: 0 auto;
}

.search-input {
  width: 100%;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-top: 2px solid var(--amber2);
  padding: 13px 44px 13px 18px;
  font-family: 'Space Mono', monospace;
  font-size: 13px;
  color: var(--text);
  outline: none;
  letter-spacing: 1px;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.search-input::placeholder {
  color: var(--muted);
}

.search-input:focus {
  border-color: var(--amber);
  box-shadow: 0 4px 20px rgba(232,197,71,0.07);
}

.search-icon {
  position: absolute;
  right: 15px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--amber2);
  font-size: 17px;
  pointer-events: none;
}

/* ── TOOLBAR ── */

.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  margin-bottom: 18px;
  flex-wrap: wrap;
}

.toolbar-left {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.result-count {
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 2px;
  white-space: nowrap;
}

.result-count span {
  color: var(--amber);
}

/* ── SORT ── */

.sort-widget {
  display: flex;
  align-items: stretch;
  border: 1px solid var(--border);
  border-radius: 2px;
  overflow: hidden;
  font-size: 10px;
  letter-spacing: 1px;
}

.sort-label {
  padding: 7px 10px;
  background: var(--bg3);
  border-right: 1px solid var(--border);
  color: var(--muted);
  white-space: nowrap;
  user-select: none;
  display: flex;
  align-items: center;
}

.sort-option {
  padding: 0 11px;
  cursor: pointer;
  background: transparent;
  border: none;
  border-right: 1px solid var(--border);
  font-family: 'Space Mono', monospace;
  font-size: 10px;
  letter-spacing: 1px;
  color: var(--muted);
  transition: all 0.12s;
  white-space: nowrap;
  height: 100%;
  min-height: 32px;
}

.sort-option:last-child {
  border-right: none;
}

.sort-option:hover {
  background: rgba(232,197,71,0.05);
  color: var(--text);
}

.sort-option.active {
  background: rgba(232,197,71,0.1);
  color: var(--amber);
}

/* ── BUTTONS ── */

.btn {
  font-family: 'Space Mono', monospace;
  font-size: 10px;
  letter-spacing: 2px;
  padding: 8px 16px;
  border: 1px solid;
  cursor: pointer;
  transition: all 0.15s;
  text-transform: uppercase;
  background: transparent;
  border-radius: 2px;
  white-space: nowrap;
}

.btn-amber {
  border-color: var(--amber);
  color: var(--amber);
}

.btn-amber:hover {
  background: var(--amber);
  color: var(--bg);
}

.btn-rust {
  border-color: var(--rust);
  color: var(--rust);
}

.btn-rust:hover {
  background: var(--rust);
  color: var(--bg);
}

.view-toggle {
  display: flex;
  border: 1px solid var(--border);
  border-radius: 2px;
  overflow: hidden;
}

.view-btn {
  background: transparent;
  border: none;
  border-right: 1px solid var(--border);
  color: var(--muted);
  padding: 8px 13px;
  cursor: pointer;
  font-size: 13px;
  transition: all 0.12s;
}

.view-btn:last-child {
  border-right: none;
}

.view-btn.active {
  background: rgba(232,197,71,0.1);
  color: var(--amber);
}

/* ── FILTER PANEL ── */

.filter-panel {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-left: 3px solid var(--amber2);
  padding: 22px 24px;
  margin-bottom: 20px;
  display: none;
}

.filter-panel.open {
  display: block;
}

.filter-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
  gap: 20px;
  margin-bottom: 16px;
}

.filter-group label {
  display: block;
  font-size: 9px;
  letter-spacing: 3px;
  color: var(--amber2);
  text-transform: uppercase;
  margin-bottom: 10px;
}

.filter-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}

.chip {
  font-family: 'Space Mono', monospace;
  font-size: 10px;
  letter-spacing: 1px;
  padding: 4px 10px;
  border: 1px solid rgba(90,100,114,0.35);
  cursor: pointer;
  color: var(--muted);
  background: transparent;
  transition: all 0.12s;
  white-space: nowrap;
  border-radius: 1px;
}

.chip:hover {
  border-color: var(--amber2);
  color: var(--text);
}

.chip.active {
  background: rgba(232,197,71,0.1);
  border-color: var(--amber);
  color: var(--amber);
}

.filter-divider {
  height: 1px;
  background: var(--border2);
  margin: 14px 0;
}

.filter-actions {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
}

.active-filters {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  flex: 1;
}

.active-filter-tag {
  font-size: 9px;
  padding: 3px 9px;
  background: rgba(196,91,58,0.1);
  border: 1px solid rgba(196,91,58,0.3);
  color: var(--rust);
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  letter-spacing: 1px;
  border-radius: 1px;
}

.active-filter-tag:hover {
  background: rgba(196,91,58,0.2);
}

/* ── GRID ── */

.names-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
  gap: 12px;
  margin-bottom: 48px;
}

/* ── LIST ── */

.names-list {
  display: flex;
  flex-direction: column;
  gap: 2px;
  margin-bottom: 48px;
}

/* ── GRID CARD ── */

.name-card {
  background: var(--bg2);
  border: 1px solid var(--border2);
  padding: 20px;
  cursor: pointer;
  transition: all 0.16s;
  display: flex;
  flex-direction: column;
  gap: 11px;
  position: relative;
  overflow: hidden;
  user-select: none;
}

.name-card::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: linear-gradient(90deg, var(--amber2), var(--amber));
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.2s;
}

.name-card:hover {
  border-color: rgba(232,197,71,0.28);
  background: var(--bg3);
}

.name-card:hover::after {
  transform: scaleX(1);
}

.name-card.flash {
  background: rgba(232,197,71,0.07);
  border-color: var(--amber);
}

.card-title {
  font-family: 'Orbitron', sans-serif;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 1.5px;
  color: var(--text);
  line-height: 1.3;
}

.card-meta {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  align-items: center;
}

.badge {
  font-size: 8px;
  letter-spacing: 2px;
  padding: 3px 7px;
  border-radius: 1px;
  text-transform: uppercase;
  font-weight: 700;
}

.badge-category {
  background: rgba(232,197,71,0.1);
  color: var(--amber2);
  border: 1px solid rgba(232,197,71,0.2);
}

.badge-mood {
  background: rgba(122,171,138,0.1);
  color: var(--sage);
  border: 1px solid rgba(122,171,138,0.2);
}

.badge-style {
  background: rgba(143,163,184,0.1);
  color: var(--slate);
  border: 1px solid rgba(143,163,184,0.2);
}

.badge-length {
  background: rgba(196,91,58,0.08);
  color: var(--rust);
  border: 1px solid rgba(196,91,58,0.2);
}

.card-tags-inline {
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 1px;
  line-height: 1.6;
}

.card-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 9px;
  color: var(--muted);
  border-top: 1px solid var(--border2);
  padding-top: 10px;
  letter-spacing: 2px;
}

/* ── LIST ROW ── */

.list-row {
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 11px 16px;
  background: var(--bg2);
  border: 1px solid var(--border2);
  cursor: pointer;
  transition: all 0.12s;
  user-select: none;
}

.list-row:hover {
  background: var(--bg3);
  border-color: rgba(232,197,71,0.22);
}

.list-row.flash {
  background: rgba(232,197,71,0.06);
  border-color: var(--amber);
}

.list-title {
  font-family: 'Orbitron', sans-serif;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 1.5px;
  color: var(--text);
  flex: 1;
  min-width: 0;
}

.list-copy {
  font-size: 8px;
  letter-spacing: 2px;
  color: rgba(90,100,114,0.55);
  flex-shrink: 0;
}

/* ── EMPTY ── */

.empty-state {
  text-align: center;
  padding: 80px 20px;
  color: var(--muted);
  grid-column: 1 / -1;
}

.empty-state .e-icon {
  font-size: 36px;
  opacity: 0.2;
  margin-bottom: 14px;
}

.empty-state p {
  font-size: 10px;
  letter-spacing: 3px;
  text-transform: uppercase;
}

/* ── MODAL ── */

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(8,11,15,0.88);
  backdrop-filter: blur(6px);
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.22s;
}

.modal-overlay.open {
  opacity: 1;
  pointer-events: all;
}

.modal {
  background: var(--bg2);
  border: 1px solid rgba(232,197,71,0.22);
  border-top: 3px solid var(--amber);
  padding: 30px;
  width: 100%;
  max-width: 510px;
  max-height: 88vh;
  overflow-y: auto;
  box-shadow: 0 24px 80px rgba(0,0,0,0.55);
  transform: translateY(14px);
  transition: transform 0.22s;
}

.modal-overlay.open .modal {
  transform: translateY(0);
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 26px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--border2);
}

.modal-title {
  font-family: 'Orbitron', sans-serif;
  font-size: 13px;
  letter-spacing: 4px;
  color: var(--amber);
}

.modal-close {
  background: none;
  border: 1px solid var(--border);
  color: var(--muted);
  font-size: 13px;
  cursor: pointer;
  padding: 4px 9px;
  transition: all 0.12s;
}

.modal-close:hover {
  border-color: var(--rust);
  color: var(--rust);
}

.form-group {
  margin-bottom: 18px;
}

.form-label {
  display: block;
  font-size: 9px;
  letter-spacing: 3px;
  color: var(--amber2);
  text-transform: uppercase;
  margin-bottom: 7px;
}

.form-input {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  padding: 10px 13px;
  font-family: 'Space Mono', monospace;
  font-size: 12px;
  color: var(--text);
  outline: none;
  transition: border-color 0.15s;
  letter-spacing: 0.5px;
  border-radius: 1px;
}

.form-input:focus {
  border-color: var(--amber2);
}

.form-input[readonly] {
  opacity: 0.4;
  cursor: default;
}

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

.modal-footer {
  display: flex;
  gap: 10px;
  justify-content: flex-end;
  margin-top: 22px;
  padding-top: 18px;
  border-top: 1px solid var(--border2);
}

/* ── TOAST ── */

.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(60px);
  background: var(--bg3);
  border: 1px solid var(--amber);
  padding: 10px 22px;
  font-size: 10px;
  color: var(--amber);
  letter-spacing: 3px;
  z-index: 300;
  opacity: 0;
  transition: all 0.22s;
  white-space: nowrap;
}

.toast.show {
  transform: translateX(-50%) translateY(0);
  opacity: 1;
}

/* ── SCROLLBAR ── */

::-webkit-scrollbar {
  width: 5px;
}

::-webkit-scrollbar-track {
  background: var(--bg);
}

::-webkit-scrollbar-thumb {
  background: rgba(232,197,71,0.18);
}

::-webkit-scrollbar-thumb:hover {
  background: rgba(232,197,71,0.38);
}

@media (max-width: 620px) {

  .form-row {
    grid-template-columns: 1fr;
  }

  .names-grid {
    grid-template-columns: 1fr;
  }

  .sort-option {
    padding: 0 7px;
    font-size: 9px;
  }
}
</style>
</head>

<body>

<div class="container">

<header>
  <div class="header-eyebrow">
    ネーミングデータベースアーカイブ · v2.0
  </div>

  <h1 class="header-title">ＮＡＭＥＤＲＯＰ</h1>

  <div class="header-sub">
    名前のアーカイブ — Name Archive System
  </div>

  <div class="header-stats">
    <div class="stat-pill">
      ENTRIES <span class="val" id="stat-total">0</span>
    </div>

    <div class="stat-pill">
      FILTERED <span class="val" id="stat-filtered">0</span>
    </div>

    <div class="stat-pill">
      TAGS <span class="val" id="stat-tags">0</span>
    </div>
  </div>
</header>

<div class="search-section">
  <div class="search-wrap">
    <input
      type="text"
      class="search-input"
      id="search-input"
      placeholder="Search..."
    >
    <span class="search-icon">⌕</span>
  </div>
</div>

<div class="toolbar">

  <div class="toolbar-left">

    <button class="btn btn-amber" id="filter-toggle">
      ⊞ FILTERS
    </button>

    <div class="sort-widget">

      <span class="sort-label">SORT</span>

      <button class="sort-option active" data-sort="default">
        DEFAULT
      </button>

      <button class="sort-option" data-sort="alpha-asc">
        A→Z
      </button>

      <button class="sort-option" data-sort="alpha-desc">
        Z→A
      </button>

      <button class="sort-option" data-sort="len-asc">
        LEN↑
      </button>

      <button class="sort-option" data-sort="len-desc">
        LEN↓
      </button>

      <button class="sort-option" data-sort="newest">
        NEW
      </button>

    </div>

    <span class="result-count">
      SHOWING
      <span id="rc-filtered">0</span>
      OF
      <span id="rc-total">0</span>
    </span>

  </div>

  <div style="display:flex;gap:8px;align-items:center;">

    <div class="view-toggle">

      <button class="view-btn active" id="view-grid" title="Grid">
        ⊞
      </button>

      <button class="view-btn" id="view-list" title="List">
        ☰
      </button>

    </div>

    <button class="btn btn-amber" id="add-btn">
      + NEW ENTRY
    </button>

  </div>

</div>

<div class="filter-panel" id="filter-panel">

  <div class="filter-grid">

    <div class="filter-group">
      <label>Category</label>
      <div class="filter-chips" id="fc-category"></div>
    </div>

    <div class="filter-group">
      <label>Mood</label>
      <div class="filter-chips" id="fc-mood"></div>
    </div>

    <div class="filter-group">
      <label>Style</label>
      <div class="filter-chips" id="fc-style"></div>
    </div>

    <div class="filter-group">
      <label>Length</label>
      <div class="filter-chips" id="fc-length"></div>
    </div>

  </div>

  <div class="filter-divider"></div>

  <div class="filter-group">
    <label>Tags</label>
    <div class="filter-chips" id="fc-tags"></div>
  </div>

  <div class="filter-divider"></div>

  <div class="filter-actions">
    <div class="active-filters" id="active-filters"></div>

    <button class="btn btn-rust" id="clear-filters">
      ✕ CLEAR
    </button>
  </div>

</div>

<div id="names-container"></div>

</div>

<!-- MODAL -->

<div class="modal-overlay" id="modal-overlay">

  <div class="modal">

    <div class="modal-header">

      <span class="modal-title" id="modal-title">
        NEW ENTRY
      </span>

      <button class="modal-close" id="modal-close">
        ✕
      </button>

    </div>

    <div class="form-group">

      <label class="form-label">
        Title *
      </label>

      <input
        type="text"
        class="form-input"
        id="f-title"
        placeholder="e.g. Synthetic Entrance"
      >

    </div>

    <div class="form-row">

      <div class="form-group">

        <label class="form-label">
          Category *
        </label>

        <input
          type="text"
          class="form-input"
          id="f-category"
          placeholder="Technical, Atmospheric…"
        >
      </div>

      <div class="form-group">

        <label class="form-label">
          Mood *
        </label>

        <input
          type="text"
          class="form-input"
          id="f-mood"
          placeholder="Dreamy, Eerie, Hopeful…"
        >

      </div>

    </div>

    <div class="form-row">

      <div class="form-group">

        <label class="form-label">
          Style
        </label>

        <input
          type="text"
          class="form-input"
          id="f-style"
          placeholder="Glitch, Formal, Casual…"
        >

      </div>

      <div class="form-group">

        <label class="form-label">
          Length
        </label>

        <input
          type="text"
          class="form-input"
          id="f-length"
          readonly
          placeholder="Auto-detected"
        >

      </div>

    </div>

    <div class="form-group">

      <label class="form-label">
        Tags
        <span style="color:var(--muted);font-weight:400">
          (comma-separated)
        </span>
      </label>

      <input
        type="text"
        class="form-input"
        id="f-tags"
        placeholder="cyber, retro, nostalgia"
      >

    </div>

    <div class="modal-footer">

      <button class="btn btn-rust" id="modal-cancel">
        CANCEL
      </button>

      <button class="btn btn-amber" id="modal-save">
        SAVE
      </button>

    </div>

  </div>

</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = "https://zsiilkcothfqtdmazbds.supabase.co";
const SUPABASE_KEY = "sb_publishable_2g6DAgmpVToaCGIqUfQivg_416bQvVy";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let entries = [];

async function loadEntries() {

  const { data, error } = await supabaseClient
    .from('namedrop_entries')
    .select('*')
    .order('added', { ascending: false });

  if (error) {
    console.log(error);
    return;
  }

  entries = data;
  render();
}

function allEntries() {
  return entries;
}

let currentView = 'grid';
let currentSort = 'default';

let activeFilters = {
  category:[],
  mood:[],
  style:[],
  length:[],
  tags:[]
};

let editingId = null;

function wordLen(title) {
  const w = title.trim().split(/\s+/).length;

  if (w <= 2) return 'Short (1–2)';
  if (w === 3) return 'Medium (3)';
  return 'Long (4+)';
}

function getAllTags() {
  const s = new Set();

  allEntries().forEach(e =>
    (e.tags || []).forEach(t => s.add(t))
  );

  return [...s].sort();
}

function uniqueVals(key) {
  return [...new Set(
    allEntries().map(e => e[key]).filter(Boolean)
  )].sort();
}

function getEntry(id) {
  return allEntries().find(e => e.id === id);
}

function showToast(msg) {
  const t = document.getElementById('toast');

  t.textContent = msg;
  t.classList.add('show');

  clearTimeout(t._t);

  t._t = setTimeout(() => {
    t.classList.remove('show');
  }, 2000);
}

function flashCard(id) {
  const el = document.querySelector(`[data-id="${id}"]`);

  if (!el) return;

  el.classList.add('flash');

  setTimeout(() => {
    el.classList.remove('flash');
  }, 550);
}

function buildChips() {

  buildGroup(
    'fc-category',
    uniqueVals('category'),
    'category'
  );

  buildGroup(
    'fc-mood',
    uniqueVals('mood'),
    'mood'
  );

  buildGroup(
    'fc-style',
    uniqueVals('style'),
    'style'
  );

  buildGroup(
    'fc-length',
    ['Short (1–2)', 'Medium (3)', 'Long (4+)'],
    'length'
  );

  const tw = document.getElementById('fc-tags');

  tw.innerHTML = '';

  getAllTags().forEach(t => {
    tw.appendChild(
      chip(
        '#' + t,
        activeFilters.tags.includes(t),
        () => toggleFilter('tags', t)
      )
    );
  });

  renderActiveFilters();
}

function buildGroup(elId, vals, type) {

  const w = document.getElementById(elId);

  w.innerHTML = '';

  vals.forEach(v => {
    w.appendChild(
      chip(
        v,
        activeFilters[type].includes(v),
        () => toggleFilter(type, v)
      )
    );
  });
}

function chip(label, isActive, onClick) {

  const b = document.createElement('button');

  b.className = 'chip' + (isActive ? ' active' : '');

  b.textContent = label;

  b.onclick = onClick;

  return b;
}

function toggleFilter(type, val) {

  const arr = activeFilters[type];

  const i = arr.indexOf(val);

  if (i >= 0) {
    arr.splice(i, 1);
  } else {
    arr.push(val);
  }

  buildChips();
  render();
}

function renderActiveFilters() {

  const w = document.getElementById('active-filters');

  w.innerHTML = '';

  Object.entries(activeFilters).forEach(([type, vals]) => {

    vals.forEach(v => {

      const d = document.createElement('div');

      d.className = 'active-filter-tag';

      d.innerHTML = `${type}: ${v} <span>✕</span>`;

      d.onclick = () => toggleFilter(type, v);

      w.appendChild(d);
    });

  });
}

function getFiltered() {

  const q = document
    .getElementById('search-input')
    .value
    .toLowerCase()
    .trim();

  let items = allEntries().filter(e => {

    if (q) {

      const hay = [
        e.title,
        e.category,
        e.mood,
        e.style,
        ...(e.tags || [])
      ].join(' ').toLowerCase();

      if (!hay.includes(q)) return false;
    }

    if (
      activeFilters.category.length &&
      !activeFilters.category.includes(e.category)
    ) return false;

    if (
      activeFilters.mood.length &&
      !activeFilters.mood.includes(e.mood)
    ) return false;

    if (
      activeFilters.style.length &&
      !activeFilters.style.includes(e.style)
    ) return false;

    if (
      activeFilters.length.length &&
      !activeFilters.length.includes(wordLen(e.title))
    ) return false;

    if (
      activeFilters.tags.length &&
      !activeFilters.tags.some(t => (e.tags || []).includes(t))
    ) return false;

    return true;
  });

  const s = currentSort;

  if (s === 'alpha-asc') {
    items.sort((a,b) => a.title.localeCompare(b.title));
  }

  if (s === 'alpha-desc') {
    items.sort((a,b) => b.title.localeCompare(a.title));
  }

  if (s === 'len-asc') {
    items.sort((a,b) => a.title.length - b.title.length);
  }

  if (s === 'len-desc') {
    items.sort((a,b) => b.title.length - a.title.length);
  }

  if (s === 'newest') {
    items.sort((a,b) => b.added - a.added);
  }

  return items;
}

function render() {

  const items = getFiltered();
  const all = allEntries();

  document.getElementById('stat-total').textContent = all.length;
  document.getElementById('stat-filtered').textContent = items.length;
  document.getElementById('stat-tags').textContent = getAllTags().length;

  document.getElementById('rc-filtered').textContent = items.length;
  document.getElementById('rc-total').textContent = all.length;

  const c = document.getElementById('names-container');

  if (currentView === 'grid') {

    c.className = 'names-grid';

    c.innerHTML = items.length
      ? items.map(gridCard).join('')
      : emptyHTML();

  } else {

    c.className = 'names-list';

    c.innerHTML = items.length
      ? items.map(listRow).join('')
      : emptyHTML();
  }

  buildChips();
}

function emptyHTML() {
  return `
    <div class="empty-state">
      <div class="e-icon">◈</div>
      <p>No entries match</p>
    </div>
  `;
}

function gridCard(e) {

  const tags = (e.tags || [])
    .map(t => `#${t}`)
    .join(', ');

  return `
    <div
      class="name-card"
      data-id="${e.id}"
      onclick="copyEntry(${e.id})"
    >

      <div class="card-title">
        ${e.title}
      </div>

      <div class="card-meta">

        ${e.category ? `
          <span class="badge badge-category">
            ${e.category}
          </span>
        ` : ''}

        ${e.mood ? `
          <span class="badge badge-mood">
            ${e.mood}
          </span>
        ` : ''}

        ${e.style ? `
          <span class="badge badge-style">
            ${e.style}
          </span>
        ` : ''}

      </div>

      ${tags ? `
        <div class="card-tags-inline">
          ${tags}
        </div>
      ` : ''}

      <div class="card-footer">

        <span>
          ID·${String(e.id).padStart(4,'0')}
        </span>

        <span class="badge badge-length">
          ${wordLen(e.title)}
        </span>

      </div>

    </div>
  `;
}

function listRow(e) {

  return `
    <div
      class="list-row"
      data-id="${e.id}"
      onclick="copyEntry(${e.id})"
    >

      <span class="list-title">
        ${e.title}
      </span>

      <span class="list-copy">
        ID·${String(e.id).padStart(4,'0')}
      </span>

    </div>
  `;
}

function copyEntry(id) {

  const e = getEntry(id);

  if (!e) return;

  navigator.clipboard.writeText(e.title).catch(() => {});

  flashCard(id);

  showToast('COPIED — ' + e.title);
}

async function deleteEntry(id) {

  const { error } = await supabaseClient
    .from('namedrop_entries')
    .delete()
    .eq('id', id);

  if (error) {
    console.log(error);
    return;
  }

  showToast("DELETED");
  loadEntries();
}
  
function openModal() {
  document
    .getElementById('modal-overlay')
    .classList
    .add('open');
}

function closeModal() {

  document
    .getElementById('modal-overlay')
    .classList
    .remove('open');

  editingId = null;

  [
    'f-title',
    'f-category',
    'f-mood',
    'f-style',
    'f-tags',
    'f-length'
  ].forEach(id => {
    document.getElementById(id).value = '';
  });

  document.getElementById('modal-title').textContent = 'NEW ENTRY';
}

function updateLenPreview() {

  const v = document.getElementById('f-title').value;

  document.getElementById('f-length').value =
    v.trim() ? wordLen(v) : '';
}

async function saveEntry() {
  const title = document.getElementById('f-title').value.trim();
  const category = document.getElementById('f-category').value.trim();
  const mood = document.getElementById('f-mood').value.trim();
  const style = document.getElementById('f-style').value.trim();

  const tags = document
    .getElementById('f-tags')
    .value
    .split(',')
    .map(t => t.trim().toLowerCase())
    .filter(Boolean);

  if (!title || !category || !mood) {
    showToast("FILL REQUIRED FIELDS");
    return;
  }

  const { error } = await supabaseClient
    .from('namedrop_entries')
    .insert([{
      title,
      category,
      mood,
      style,
      tags,
      added: Date.now()
    }]);

  if (error) {
    console.log(error);
    showToast("ERROR SAVING");
    return;
  }

  showToast("ADDED — " + title);

  closeModal();
  loadEntries();
}

/* ── EVENTS ── */

document
  .getElementById('search-input')
  .addEventListener('input', render);

document
  .querySelectorAll('.sort-option')
  .forEach(btn => {

    btn.addEventListener('click', () => {

      document
        .querySelectorAll('.sort-option')
        .forEach(b => b.classList.remove('active'));

      btn.classList.add('active');

      currentSort = btn.dataset.sort;

      render();
    });

  });

document.getElementById('filter-toggle').onclick = () =>
  document
    .getElementById('filter-panel')
    .classList
    .toggle('open');

document.getElementById('clear-filters').onclick = () => {

  activeFilters = {
    category:[],
    mood:[],
    style:[],
    length:[],
    tags:[]
  };

  buildChips();
  render();
};

document.getElementById('add-btn').onclick = () => {
  editingId = null;
  openModal();
};

document.getElementById('modal-close').onclick = closeModal;
document.getElementById('modal-cancel').onclick = closeModal;
document.getElementById('modal-save').onclick = saveEntry;

document
  .getElementById('f-title')
  .addEventListener('input', updateLenPreview);

document
  .getElementById('modal-overlay')
  .addEventListener('click', e => {

    if (
      e.target === document.getElementById('modal-overlay')
    ) {
      closeModal();
    }
  });

document.getElementById('view-grid').onclick = () => {

  currentView = 'grid';

  document
    .getElementById('view-grid')
    .classList
    .add('active');

  document
    .getElementById('view-list')
    .classList
    .remove('active');

  render();
};

document.getElementById('view-list').onclick = () => {

  currentView = 'list';

  document
    .getElementById('view-list')
    .classList
    .add('active');

  document
    .getElementById('view-grid')
    .classList
    .remove('active');

  render();
};

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

/* ── INIT ── */
loadEntries();
buildChips();
render();
</script>
</body>
</html>
