<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search Bar Animation</title>
<link href="https://fonts.googleapis.com/css?family=Roboto:400,500" rel="stylesheet">
<style>
body{
    background:#ff4747;
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    font-family:Roboto,sans-serif;
}

#bar{
    position:relative;
    width:300px;
    height:50px;
}

/* INPUT DEFAULT */
#search-input{
    box-sizing:border-box;
    width:50px;
    height:50px;
    border:4px solid #fff;
    border-radius:50px;
    background:none;
    color:#fff;
    font-size:16px;
    outline:none;
    padding:0;
    transition:all .5s ease;
}

/* EXPANDED INPUT */
#search-input.square{
    width:300px;
    border-radius:8px;
    padding:0 50px 0 15px;
}

/* BUTTON */
.search{
    position:absolute;
    top:0;
    right:0;
    width:50px;
    height:50px;
    background:none;
    border:none;
    cursor:pointer;
}

/* SEARCH ICON */
.search::before{
    content:"";
    position:absolute;
    width:18px;
    height:18px;
    border:4px solid #fff;
    border-radius:50%;
    top:10px;
    left:10px;
    transition:.4s;
}

.search::after{
    content:"";
    position:absolute;
    width:12px;
    height:4px;
    background:#fff;
    transform:rotate(45deg);
    top:30px;
    left:28px;
    transition:.4s;
}

/* CLOSE ICON */
.search.close::before{
    width:25px;
    height:4px;
    border:none;
    border-radius:0;
    background:#fff;
    transform:rotate(45deg);
    top:22px;
    left:12px;
}

.search.close::after{
    width:25px;
    top:22px;
    left:12px;
    transform:rotate(-45deg);
}
</style>
</head>

<body>

<form id="bar">
    <input 
        type="text" 
        id="search-input" 
        placeholder="Search..."
    >

    <button type="button" class="search" id="search-btn"></button>
</form>

<script>
const input = document.getElementById("search-input");
const searchBtn = document.getElementById("search-btn");

searchBtn.addEventListener("click", function(e){

    e.preventDefault();

    input.classList.toggle("square");
    searchBtn.classList.toggle("close");

    // Auto focus when opened
    if(input.classList.contains("square")){
        input.focus();
    }else{
        input.value = "";
    }
});
</script>
</body>
</html>
