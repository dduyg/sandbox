<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ＮＡＭＥＤＲＯＰ </title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Orbitron:wght@400;700;900&family=Noto+Serif+JP:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:     #07090c;
    --bg2:    #0e1218;
    --bg3:    #141b23;
    --ice:    #a8d8ea;
    --ice2:   #6cb4cc;
    --clay:   #c47a5a;
    --moss:   #7aaa88;
    --text:   #cdd8e0;
    --muted:  #495866;
    --border: rgba(168,216,234,0.12);
    --bord2:  rgba(168,216,234,0.06);
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family:'Space Mono', monospace;
    background:var(--bg); color:var(--text);
    min-height:100vh; overflow-x:hidden;
  }

  body::before {
    content:''; position:fixed; inset:0;
    background:repeating-linear-gradient(
      180deg,
      transparent 0px, transparent 39px,
      rgba(168,216,234,0.022) 39px, rgba(168,216,234,0.022) 40px
    );
    pointer-events:none; z-index:0;
  }

  .container {
    position:relative; z-index:1;
    max-width:1320px; margin:0 auto; padding:0 28px;
  }

  /* ── HEADER ── */
  header {
    padding:52px 0 34px; text-align:center;
    border-bottom:1px solid var(--bord2); margin-bottom:36px;
  }
  .header-eyebrow {
    font-family:'Noto Serif JP', serif;
    font-size:9px; letter-spacing:9px; color:var(--muted); margin-bottom:16px;
  }
  .header-title {
    font-family:'Orbitron', sans-serif;
    font-size:clamp(30px,6vw,62px); font-weight:900; letter-spacing:6px;
    color:var(--ice); line-height:1; margin-bottom:10px;
    text-shadow:0 0 80px rgba(168,216,234,0.2);
  }
  .header-sub {
    font-size:9px; letter-spacing:6px; color:var(--muted);
    margin-bottom:24px; font-style:italic;
  }
  .header-stats {
    display:inline-flex; border:1px solid var(--border); overflow:hidden;
  }
  .stat-pill {
    padding:6px 20px; font-size:9px; letter-spacing:2px; color:var(--muted);
    border-right:1px solid var(--border);
  }
  .stat-pill:last-child { border-right:none; }
  .stat-pill .val { color:var(--ice); font-weight:700; }

  /* ── SEARCH ── */
  .search-section { margin-bottom:20px; }
  .search-wrap { position:relative; max-width:560px; margin:0 auto; }
  .search-input {
    width:100%; background:var(--bg2); border:1px solid var(--border);
    border-bottom:2px solid var(--ice2); padding:13px 44px 13px 18px;
    font-family:'Space Mono', monospace; font-size:13px; color:var(--text);
    outline:none; letter-spacing:1px; transition:border-color 0.18s, box-shadow 0.18s;
  }
  .search-input::placeholder { color:var(--muted); }
  .search-input:focus { border-color:var(--ice); box-shadow:0 4px 24px rgba(168,216,234,0.07); }
  .search-icon {
    position:absolute; right:15px; top:50%; transform:translateY(-50%);
    color:var(--ice2); font-size:17px; pointer-events:none;
  }

  /* ── TOOLBAR ── */
  .toolbar {
    display:flex; align-items:center; justify-content:space-between;
    gap:12px; margin-bottom:18px; flex-wrap:wrap;
  }
  .toolbar-left { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .result-count { font-size:9px; color:var(--muted); letter-spacing:2px; white-space:nowrap; }
  .result-count span { color:var(--ice); }

  /* custom sort — same on all devices */
  .sort-widget {
    display:flex; align-items:stretch;
    border:1px solid var(--border); overflow:hidden;
  }
  .sort-label {
    padding:0 11px; background:var(--bg3);
    border-right:1px solid var(--border); color:var(--muted);
    user-select:none; display:flex; align-items:center;
    white-space:nowrap; font-size:9px; letter-spacing:2px;
  }
  .sort-option {
    padding:0 12px; cursor:pointer; background:transparent; border:none;
    border-right:1px solid var(--border);
    font-family:'Space Mono', monospace; font-size:9px; letter-spacing:1px;
    color:var(--muted); transition:all 0.1s; white-space:nowrap; min-height:32px;
  }
  .sort-option:last-child { border-right:none; }
  .sort-option:hover { background:rgba(168,216,234,0.05); color:var(--text); }
  .sort-option.active { background:rgba(168,216,234,0.1); color:var(--ice); }

  .btn {
    font-family:'Space Mono', monospace; font-size:9px; letter-spacing:2px;
    padding:8px 16px; border:1px solid; cursor:pointer;
    transition:all 0.14s; text-transform:uppercase;
    background:transparent; white-space:nowrap;
  }
  .btn-ice  { border-color:var(--ice2); color:var(--ice2); }
  .btn-ice:hover  { background:var(--ice2); color:var(--bg); }
  .btn-clay { border-color:var(--clay); color:var(--clay); }
  .btn-clay:hover { background:var(--clay); color:var(--bg); }

  .view-toggle { display:flex; border:1px solid var(--border); overflow:hidden; }
  .view-btn {
    background:transparent; border:none; border-right:1px solid var(--border);
    color:var(--muted); padding:8px 13px; cursor:pointer; font-size:13px; transition:all 0.12s;
  }
  .view-btn:last-child { border-right:none; }
  .view-btn.active { background:rgba(168,216,234,0.1); color:var(--ice); }

  /* ── FILTER PANEL ── */
  .filter-panel {
    background:var(--bg2); border:1px solid var(--border);
    border-left:3px solid var(--ice2); padding:22px 24px;
    margin-bottom:20px; display:none;
  }
  .filter-panel.open { display:block; }
  .filter-grid {
    display:grid; grid-template-columns:repeat(auto-fill, minmax(160px,1fr));
    gap:20px; margin-bottom:16px;
  }
  .filter-group label {
    display:block; font-size:9px; letter-spacing:3px;
    color:var(--ice2); text-transform:uppercase; margin-bottom:9px;
  }
  .filter-chips { display:flex; flex-wrap:wrap; gap:5px; }
  .chip {
    font-family:'Space Mono', monospace; font-size:9px; letter-spacing:1px;
    padding:4px 9px; border:1px solid rgba(73,88,102,0.35);
    cursor:pointer; color:var(--muted); background:transparent;
    transition:all 0.1s; white-space:nowrap;
  }
  .chip:hover { border-color:var(--ice2); color:var(--text); }
  .chip.active { background:rgba(168,216,234,0.1); border-color:var(--ice); color:var(--ice); }
  .filter-divider { height:1px; background:var(--bord2); margin:14px 0; }
  .filter-actions { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .active-filters { display:flex; flex-wrap:wrap; gap:5px; flex:1; }
  .active-filter-tag {
    font-size:9px; padding:3px 9px;
    background:rgba(196,122,90,0.1); border:1px solid rgba(196,122,90,0.28);
    color:var(--clay); display:flex; align-items:center; gap:6px;
    cursor:pointer; letter-spacing:1px;
  }
  .active-filter-tag:hover { background:rgba(196,122,90,0.2); }

  /* ── GRID ── */
  .names-grid {
    display:grid; grid-template-columns:repeat(auto-fill, minmax(268px,1fr));
    gap:10px; margin-bottom:52px;
  }

  /* ── LIST — title + id only ── */
  .names-list { display:flex; flex-direction:column; gap:2px; margin-bottom:52px; }

  /* ── GRID CARD ── */
  .name-card {
    background:var(--bg2); border:1px solid var(--bord2);
    padding:20px; cursor:pointer; transition:all 0.15s;
    display:flex; flex-direction:column; gap:11px;
    position:relative; overflow:hidden; user-select:none;
  }
  .name-card::before {
    content:''; position:absolute; top:0; left:0; right:0; height:1px;
    background:linear-gradient(90deg, transparent, var(--ice2), transparent);
    opacity:0; transition:opacity 0.2s;
  }
  .name-card:hover { border-color:rgba(168,216,234,0.22); background:var(--bg3); }
  .name-card:hover::before { opacity:1; }
  .name-card.flash { background:rgba(168,216,234,0.06); border-color:var(--ice); }

  .card-title {
    font-family:'Orbitron', sans-serif; font-size:14px; font-weight:700;
    letter-spacing:1.5px; color:var(--text); line-height:1.3;
  }
  .card-meta { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .badge {
    font-size:8px; letter-spacing:2px; padding:3px 7px;
    text-transform:uppercase; font-weight:700;
  }
  .badge-category { background:rgba(168,216,234,0.09); color:var(--ice2);  border:1px solid rgba(168,216,234,0.18); }
  .badge-mood     { background:rgba(122,170,136,0.09); color:var(--moss);  border:1px solid rgba(122,170,136,0.2);  }
  .badge-style    { background:rgba(205,232,240,0.07); color:#8fb8c8;      border:1px solid rgba(143,184,200,0.18); }
  .badge-length   { background:rgba(196,122,90,0.08);  color:var(--clay);  border:1px solid rgba(196,122,90,0.2);   }
  .card-tags { display:flex; gap:5px; flex-wrap:wrap; }
  .tag {
    font-size:9px; color:var(--muted); padding:2px 6px;
    border:1px solid rgba(73,88,102,0.22); letter-spacing:1px;
  }
  .card-footer {
    display:flex; justify-content:space-between; align-items:center;
    font-size:9px; color:var(--muted);
    border-top:1px solid var(--bord2); padding-top:10px; letter-spacing:2px;
  }
  .copy-hint {
    font-size:8px; letter-spacing:2px;
    color:rgba(73,88,102,0.4); text-transform:uppercase; transition:color 0.12s;
  }
  .name-card:hover .copy-hint { color:var(--ice2); }

  /* ── LIST ROW ── */
  .list-row {
    display:flex; align-items:center; gap:20px; padding:11px 18px;
    background:var(--bg2); border:1px solid var(--bord2);
    cursor:pointer; transition:all 0.1s; user-select:none;
  }
  .list-row:hover { background:var(--bg3); border-color:rgba(168,216,234,0.2); }
  .list-row.flash { background:rgba(168,216,234,0.05); border-color:var(--ice); }
  .list-id { font-size:9px; color:var(--muted); letter-spacing:2px; flex-shrink:0; width:52px; }
  .list-title {
    font-family:'Orbitron', sans-serif; font-size:13px; font-weight:700;
    letter-spacing:1.5px; color:var(--text); flex:1; min-width:0;
  }
  .list-copy {
    font-size:8px; letter-spacing:2px;
    color:rgba(73,88,102,0.35); flex-shrink:0; transition:color 0.1s;
  }
  .list-row:hover .list-copy { color:var(--ice2); }

  /* ── EMPTY ── */
  .empty-state { text-align:center; padding:80px 20px; color:var(--muted); grid-column:1/-1; }
  .empty-state .e-icon { font-size:36px; opacity:0.15; margin-bottom:14px; }
  .empty-state p { font-size:9px; letter-spacing:3px; text-transform:uppercase; }

  /* ── MODAL ── */
  .modal-overlay {
    position:fixed; inset:0; background:rgba(4,6,9,0.92);
    backdrop-filter:blur(8px); z-index:100;
    display:flex; align-items:center; justify-content:center; padding:20px;
    opacity:0; pointer-events:none; transition:opacity 0.2s;
  }
  .modal-overlay.open { opacity:1; pointer-events:all; }
  .modal {
    background:var(--bg2); border:1px solid rgba(168,216,234,0.18);
    border-top:2px solid var(--ice2); padding:32px; width:100%;
    max-width:560px; max-height:90vh; overflow-y:auto;
    box-shadow:0 0 60px rgba(168,216,234,0.08);
    transform:translateY(16px); transition:transform 0.22s;
  }
  .modal-overlay.open .modal { transform:translateY(0); }
  .modal-header {
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:26px; padding-bottom:14px; border-bottom:1px solid var(--bord2);
  }
  .modal-title { font-family:'Orbitron', sans-serif; font-size:13px; letter-spacing:4px; color:var(--ice); }
  .modal-close { background:none; border:none; color:var(--muted); font-size:18px; cursor:pointer; transition:color 0.15s; }
  .modal-close:hover { color:var(--clay); }

  .form-group { margin-bottom:18px; }
  .form-label { display:block; font-size:9px; letter-spacing:3px; color:var(--ice2); text-transform:uppercase; margin-bottom:8px; }
  .form-input {
    width:100%; background:rgba(168,216,234,0.04); border:1px solid var(--border);
    padding:10px 14px; font-family:'Space Mono', monospace; font-size:12px;
    color:var(--text); outline:none; transition:border-color 0.15s; letter-spacing:0.5px;
  }
  .form-input:focus { border-color:var(--ice2); }
  .form-input[readonly] { opacity:0.4; cursor:default; }
  .form-row { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .form-hint { font-size:9px; color:var(--muted); margin-top:5px; letter-spacing:1px; }
  .modal-footer {
    display:flex; gap:10px; justify-content:flex-end;
    margin-top:22px; padding-top:18px; border-top:1px solid var(--bord2);
  }

  /* ── CONTEXT MENU ── */
  .ctx-menu {
    position:fixed; z-index:200; background:var(--bg2);
    border:1px solid var(--border); border-left:2px solid var(--ice2);
    padding:6px 0; min-width:130px;
    opacity:0; pointer-events:none; transform:scale(0.96);
    transition:opacity 0.12s, transform 0.12s;
  }
  .ctx-menu.open { opacity:1; pointer-events:all; transform:scale(1); }
  .ctx-item {
    display:block; width:100%; background:none; border:none;
    font-family:'Space Mono', monospace; font-size:10px; letter-spacing:2px;
    color:var(--text); padding:8px 16px; text-align:left; cursor:pointer; transition:background 0.1s;
  }
  .ctx-item:hover { background:rgba(168,216,234,0.07); }
  .ctx-item.danger { color:var(--clay); }
  .ctx-item.danger:hover { background:rgba(196,122,90,0.1); }

  /* ── TOAST ── */
  .toast {
    position:fixed; bottom:24px; right:24px; background:var(--bg3);
    border:1px solid rgba(168,216,234,0.25); border-left:3px solid var(--ice2);
    padding:11px 20px; font-size:10px; color:var(--ice); letter-spacing:2px;
    z-index:300; transform:translateY(60px); opacity:0; transition:all 0.22s;
  }
  .toast.show { transform:translateY(0); opacity:1; }

  ::-webkit-scrollbar { width:5px; }
  ::-webkit-scrollbar-track { background:var(--bg); }
  ::-webkit-scrollbar-thumb { background:rgba(168,216,234,0.18); }
  ::-webkit-scrollbar-thumb:hover { background:rgba(168,216,234,0.35); }

  @media (max-width:600px) {
    .form-row { grid-template-columns:1fr; }
    .names-grid { grid-template-columns:1fr; }
    .sort-option { padding:0 8px; }
  }
</style>
</head>
<body>

<div class="container">

  <header>
    <div class="header-eyebrow">ネームドロップ · Name Archive System · v3.0</div>
    <h1 class="header-title">ＮＡＭＥＤＲＯＰ</h1>
    <div class="header-sub">project name collection &amp; generator database</div>
    <div class="header-stats">
      <div class="stat-pill">TOTAL <span class="val" id="stat-total">0</span></div>
      <div class="stat-pill">SHOWN <span class="val" id="stat-filtered">0</span></div>
      <div class="stat-pill">TAGS <span class="val" id="stat-tags">0</span></div>
    </div>
  </header>

  <div class="search-section">
    <div class="search-wrap">
      <input type="text" class="search-input" id="search-input" placeholder="SEARCH TITLES, TAGS, MOODS…">
      <span class="search-icon">⌕</span>
    </div>
  </div>

  <div class="toolbar">
    <div class="toolbar-left">
      <button class="btn btn-ice" id="filter-toggle">⊞ FILTERS</button>
      <div class="sort-widget">
        <span class="sort-label">SORT</span>
        <button class="sort-option active" data-sort="default">DEFAULT</button>
        <button class="sort-option" data-sort="alpha-asc">A→Z</button>
        <button class="sort-option" data-sort="alpha-desc">Z→A</button>
        <button class="sort-option" data-sort="len-asc">LEN↑</button>
        <button class="sort-option" data-sort="len-desc">LEN↓</button>
        <button class="sort-option" data-sort="newest">NEW</button>
      </div>
      <span class="result-count"><span id="rc-filtered">0</span> / <span id="rc-total">0</span></span>
    </div>
    <div style="display:flex;gap:8px;align-items:center;">
      <div class="view-toggle">
        <button class="view-btn active" id="view-grid" title="Grid">⊞</button>
        <button class="view-btn" id="view-list" title="List">☰</button>
      </div>
      <button class="btn btn-ice" id="add-btn">+ ADD</button>
    </div>
  </div>

  <div class="filter-panel" id="filter-panel">
    <div class="filter-grid">
      <div class="filter-group">
        <label>Category</label>
        <div class="filter-chips" id="fc-category"></div>
      </div>
      <div class="filter-group">
        <label>Mood</label>
        <div class="filter-chips" id="fc-mood"></div>
      </div>
      <div class="filter-group">
        <label>Style</label>
        <div class="filter-chips" id="fc-style"></div>
      </div>
      <div class="filter-group">
        <label>Length</label>
        <div class="filter-chips" id="fc-length"></div>
      </div>
    </div>
    <div class="filter-divider"></div>
    <div class="filter-group">
      <label>Tags</label>
      <div class="filter-chips" id="fc-tags"></div>
    </div>
    <div class="filter-divider"></div>
    <div class="filter-actions">
      <div class="active-filters" id="active-filters"></div>
      <button class="btn btn-clay" id="clear-filters">✕ CLEAR</button>
    </div>
  </div>

  <div id="names-container"></div>

</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modal-title">NEW ENTRY</span>
      <button class="modal-close" id="modal-close">✕</button>
    </div>

    <div class="form-group">
      <label class="form-label">Title *</label>
      <input type="text" class="form-input" id="f-title" placeholder="e.g. Synthetic Entrance" autocomplete="off">
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Category *</label>
        <input type="text" class="form-input" id="f-category"
          placeholder="Technical, Atmospheric…"
          list="list-category" autocomplete="off">
        <datalist id="list-category"></datalist>
        <div class="form-hint">Free text — invent new categories</div>
      </div>
      <div class="form-group">
        <label class="form-label">Mood *</label>
        <input type="text" class="form-input" id="f-mood"
          placeholder="Dreamy, Eerie, Hopeful…"
          list="list-mood" autocomplete="off">
        <datalist id="list-mood"></datalist>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Style</label>
        <input type="text" class="form-input" id="f-style"
          placeholder="Glitch, Formal, Casual…"
          list="list-style" autocomplete="off">
        <datalist id="list-style"></datalist>
      </div>
      <div class="form-group">
        <label class="form-label">Length</label>
        <input type="text" class="form-input" id="f-length" readonly placeholder="Auto-detected">
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Tags <span style="color:var(--muted);font-weight:400">(comma-separated)</span></label>
      <input type="text" class="form-input" id="f-tags" placeholder="cyber, retro, nostalgia" autocomplete="off">
    </div>

    <div class="modal-footer">
      <button class="btn btn-clay" id="modal-cancel">CANCEL</button>
      <button class="btn btn-ice"  id="modal-save">SAVE</button>
    </div>
  </div>
</div>

<!-- CONTEXT MENU (right-click on any card or row) -->
<div class="ctx-menu" id="ctx-menu">
  <button class="ctx-item" id="ctx-edit">✎  EDIT</button>
  <button class="ctx-item danger" id="ctx-delete">⊗  DELETE</button>
</div>

<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════════════
// FIXED DATASET — baked in, survives page reload
// Runtime additions live in runtime[] by design
// ═══════════════════════════════════════════════

const BASE_DB = [
  { id:1,  title:"Synthetic Entrance",      category:"Technical",     mood:"Mysterious",  style:"Creative",     tags:["cyber","tech","entry"],                added:1714000000000 },
  { id:2,  title:"Cherry Cola Skies",       category:"Atmospheric",   mood:"Dreamy",      style:"Casual",       tags:["retro","sky","pastel","nostalgia"],      added:1714086400000 },
  { id:3,  title:"Counting Constellations", category:"Atmospheric",   mood:"Melancholic", style:"Creative",     tags:["space","night","poetic"],               added:1714172800000 },
  { id:4,  title:"C0d3r's Paradox",         category:"Technical",     mood:"Analytical",  style:"Glitch",       tags:["code","cyber","glitch","leet"],         added:1714259200000 },
  { id:5,  title:"Neon Meridian",           category:"Atmospheric",   mood:"Energetic",   style:"Creative",     tags:["neon","retro","city","cyber"],          added:1714345600000 },
  { id:6,  title:"Protocol Horizon",        category:"Technical",     mood:"Mysterious",  style:"Professional", tags:["tech","network","future"],             added:1714432000000 },
  { id:7,  title:"Glass Frequencies",       category:"Creative",      mood:"Dreamy",      style:"Creative",     tags:["music","ethereal","analog"],            added:1714518400000 },

  { id:23, title:"The Frequency Ward",      category:"Institutional", mood:"Eerie",       style:"Formal",       tags:["signal","system","archive","strange"],  added:1715900800000 },
  { id:24, title:"Dusk Protocol",           category:"Technical",     mood:"Melancholic", style:"Professional", tags:["network","evening","fade","order"],     added:1715987200000 },
  { id:25, title:"Bloom Index",             category:"Hybrid",        mood:"Hopeful",     style:"Creative",     tags:["nature","data","growth","system"],      added:1716073600000 },

let runtime    = [];
let deletedIds = new Set();
let nextId     = BASE_DB.length + 1;

function allEntries() {
  return [...BASE_DB.filter(e => !deletedIds.has(e.id)), ...runtime];
}

// ── STATE ──
let currentView = 'grid';
let currentSort = 'default';
let activeFilters = { category:[], mood:[], style:[], length:[], tags:[] };
let editingId    = null;
let ctxTargetId  = null;

// ── HELPERS ──
function wordLen(title) {
  const w = title.trim().split(/\s+/).length;
  if (w <= 2) return 'Short (1–2)';
  if (w === 3) return 'Medium (3)';
  return 'Long (4+)';
}
function getAllTags() {
  const s = new Set();
  allEntries().forEach(e => (e.tags||[]).forEach(t => s.add(t)));
  return [...s].sort();
}
function uniqueVals(key) {
  return [...new Set(allEntries().map(e => e[key]).filter(Boolean))].sort();
}
function getEntry(id) { return allEntries().find(e => e.id === id); }

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 2000);
}
function flashCard(id) {
  const el = document.querySelector(`[data-id="${id}"]`);
  if (!el) return;
  el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 500);
}

// ── FILTER CHIPS ──
function buildChips() {
  buildGroup('fc-category', uniqueVals('category'), 'category');
  buildGroup('fc-mood',     uniqueVals('mood'),     'mood');
  buildGroup('fc-style',    uniqueVals('style'),    'style');
  buildGroup('fc-length',   ['Short (1–2)', 'Medium (3)', 'Long (4+)'], 'length');
  const tw = document.getElementById('fc-tags');
  tw.innerHTML = '';
  getAllTags().forEach(t => tw.appendChild(chip('#'+t, activeFilters.tags.includes(t), () => toggleFilter('tags', t))));
  renderActiveFilters();
  populateLists();
}
function buildGroup(elId, vals, type) {
  const w = document.getElementById(elId); w.innerHTML = '';
  vals.forEach(v => w.appendChild(chip(v, activeFilters[type].includes(v), () => toggleFilter(type, v))));
}
function chip(label, isActive, onClick) {
  const b = document.createElement('button');
  b.className = 'chip' + (isActive ? ' active' : '');
  b.textContent = label; b.onclick = onClick; return b;
}
function toggleFilter(type, val) {
  const arr = activeFilters[type], i = arr.indexOf(val);
  if (i >= 0) arr.splice(i, 1); else arr.push(val);
  buildChips(); render();
}
function renderActiveFilters() {
  const w = document.getElementById('active-filters'); w.innerHTML = '';
  Object.entries(activeFilters).forEach(([type, vals]) => {
    vals.forEach(v => {
      const d = document.createElement('div');
      d.className = 'active-filter-tag';
      d.innerHTML = `${type}: ${v} <span>✕</span>`;
      d.onclick = () => toggleFilter(type, v);
      w.appendChild(d);
    });
  });
}
function populateLists() {
  const fill = (id, vals) => {
    const dl = document.getElementById(id); if (!dl) return;
    dl.innerHTML = vals.map(v => `<option value="${v}">`).join('');
  };
  fill('list-category', uniqueVals('category'));
  fill('list-mood',     uniqueVals('mood'));
  fill('list-style',    uniqueVals('style'));
}

// ── RENDER ──
function getFiltered() {
  const q = document.getElementById('search-input').value.toLowerCase().trim();
  let items = allEntries().filter(e => {
    if (q) {
      const hay = [e.title, e.category, e.mood, e.style, ...(e.tags||[])].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    if (activeFilters.category.length && !activeFilters.category.includes(e.category)) return false;
    if (activeFilters.mood.length     && !activeFilters.mood.includes(e.mood))         return false;
    if (activeFilters.style.length    && !activeFilters.style.includes(e.style))       return false;
    if (activeFilters.length.length   && !activeFilters.length.includes(wordLen(e.title))) return false;
    if (activeFilters.tags.length     && !activeFilters.tags.some(t => (e.tags||[]).includes(t))) return false;
    return true;
  });
  const s = currentSort;
  if (s === 'alpha-asc')  items.sort((a,b) => a.title.localeCompare(b.title));
  if (s === 'alpha-desc') items.sort((a,b) => b.title.localeCompare(a.title));
  if (s === 'len-asc')    items.sort((a,b) => a.title.length - b.title.length);
  if (s === 'len-desc')   items.sort((a,b) => b.title.length - a.title.length);
  if (s === 'newest')     items.sort((a,b) => b.added - a.added);
  return items;
}

function render() {
  const items = getFiltered(), all = allEntries();
  document.getElementById('stat-total').textContent    = all.length;
  document.getElementById('stat-filtered').textContent = items.length;
  document.getElementById('stat-tags').textContent     = getAllTags().length;
  document.getElementById('rc-filtered').textContent   = items.length;
  document.getElementById('rc-total').textContent      = all.length;
  const c = document.getElementById('names-container');
  c.className = currentView === 'grid' ? 'names-grid' : 'names-list';
  c.innerHTML = items.length
    ? items.map(currentView === 'grid' ? gridCard : listRow).join('')
    : `<div class="empty-state"><div class="e-icon">◈</div><p>No entries match</p></div>`;
  buildChips();
}

function gridCard(e) {
  const tags = (e.tags||[]).map(t => `<span class="tag">#${t}</span>`).join('');
  return `<div class="name-card" data-id="${e.id}"
    onclick="copyEntry(${e.id})"
    oncontextmenu="openCtx(event,${e.id})">
    <div class="card-title">${e.title}</div>
    <div class="card-meta">
      ${e.category ? `<span class="badge badge-category">${e.category}</span>` : ''}
      ${e.mood     ? `<span class="badge badge-mood">${e.mood}</span>`         : ''}
      ${e.style    ? `<span class="badge badge-style">${e.style}</span>`       : ''}
    </div>
    ${tags ? `<div class="card-tags">${tags}</div>` : ''}
    <div class="card-footer">
      <span>ID·${String(e.id).padStart(4,'0')}</span>
      <span class="badge badge-length">${wordLen(e.title)}</span>
      <span class="copy-hint">CLICK TO COPY</span>
    </div>
  </div>`;
}

function listRow(e) {
  return `<div class="list-row" data-id="${e.id}"
    onclick="copyEntry(${e.id})"
    oncontextmenu="openCtx(event,${e.id})">
    <span class="list-id">ID·${String(e.id).padStart(4,'0')}</span>
    <span class="list-title">${e.title}</span>
    <span class="list-copy">CLICK TO COPY</span>
  </div>`;
}

// ── COPY ON CLICK ──
function copyEntry(id) {
  const e = getEntry(id); if (!e) return;
  navigator.clipboard.writeText(e.title).catch(() => {});
  flashCard(id); showToast('COPIED — ' + e.title);
}

// ── CONTEXT MENU ──
function openCtx(evt, id) {
  evt.preventDefault(); evt.stopPropagation(); ctxTargetId = id;
  const m = document.getElementById('ctx-menu');
  m.style.left = Math.min(evt.clientX, window.innerWidth  - 150) + 'px';
  m.style.top  = Math.min(evt.clientY, window.innerHeight - 80)  + 'px';
  m.classList.add('open');
}
function closeCtx() { document.getElementById('ctx-menu').classList.remove('open'); }
document.addEventListener('click', closeCtx);
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeCtx(); closeModal(); } });
document.getElementById('ctx-edit').onclick   = ev => { ev.stopPropagation(); closeCtx(); openEdit(ctxTargetId); };
document.getElementById('ctx-delete').onclick = ev => { ev.stopPropagation(); closeCtx(); deleteEntry(ctxTargetId); };

// ── EDIT / DELETE ──
function deleteEntry(id) {
  if (!confirm('Delete this entry?')) return;
  const ri = runtime.findIndex(e => e.id === id);
  if (ri >= 0) runtime.splice(ri, 1); else deletedIds.add(id);
  render(); showToast('DELETED');
}
function openEdit(id) {
  const e = getEntry(id); if (!e) return;
  editingId = id;
  document.getElementById('modal-title').textContent = 'EDIT ENTRY';
  document.getElementById('f-title').value    = e.title;
  document.getElementById('f-category').value = e.category || '';
  document.getElementById('f-mood').value     = e.mood     || '';
  document.getElementById('f-style').value    = e.style    || '';
  document.getElementById('f-tags').value     = (e.tags||[]).join(', ');
  updateLenPreview(); openModal();
}

// ── MODAL ──
function openModal() { document.getElementById('modal-overlay').classList.add('open'); }
function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  editingId = null;
  ['f-title','f-category','f-mood','f-style','f-tags','f-length'].forEach(id => {
    document.getElementById(id).value = '';
  });
  document.getElementById('modal-title').textContent = 'NEW ENTRY';
}
function updateLenPreview() {
  const v = document.getElementById('f-title').value;
  document.getElementById('f-length').value = v.trim() ? wordLen(v) : '';
}
function saveEntry() {
  const title    = document.getElementById('f-title').value.trim();
  const category = document.getElementById('f-category').value.trim();
  const mood     = document.getElementById('f-mood').value.trim();
  const style    = document.getElementById('f-style').value.trim();
  const tags     = document.getElementById('f-tags').value
    .split(',').map(t => t.trim().toLowerCase()).filter(Boolean);
  if (!title)    { showToast('TITLE REQUIRED');    return; }
  if (!category) { showToast('CATEGORY REQUIRED'); return; }
  if (!mood)     { showToast('MOOD REQUIRED');     return; }
  if (editingId) {
    let entry = runtime.find(e => e.id === editingId) || BASE_DB.find(e => e.id === editingId);
    if (entry) Object.assign(entry, { title, category, mood, style, tags });
    showToast('UPDATED — ' + title);
  } else {
    runtime.push({ id: nextId++, title, category, mood, style, tags, added: Date.now() });
    showToast('ADDED — ' + title);
  }
  closeModal(); render();
}

// ── EVENTS ──
document.getElementById('search-input').addEventListener('input', render);
document.querySelectorAll('.sort-option').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.sort-option').forEach(b => b.classList.remove('active'));
    btn.classList.add('active'); currentSort = btn.dataset.sort; render();
  });
});
document.getElementById('filter-toggle').onclick = () =>
  document.getElementById('filter-panel').classList.toggle('open');
document.getElementById('clear-filters').onclick = () => {
  activeFilters = { category:[], mood:[], style:[], length:[], tags:[] };
  buildChips(); render();
};
document.getElementById('add-btn').onclick     = () => { editingId = null; openModal(); };
document.getElementById('modal-close').onclick  = closeModal;
document.getElementById('modal-cancel').onclick = closeModal;
document.getElementById('modal-save').onclick   = saveEntry;
document.getElementById('f-title').addEventListener('input', updateLenPreview);
document.getElementById('modal-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
});
document.getElementById('view-grid').onclick = () => {
  currentView = 'grid';
  document.getElementById('view-grid').classList.add('active');
  document.getElementById('view-list').classList.remove('active');
  render();
};
document.getElementById('view-list').onclick = () => {
  currentView = 'list';
  document.getElementById('view-list').classList.add('active');
  document.getElementById('view-grid').classList.remove('active');
  render();
};

// INIT
buildChips(); render();
</script>
