<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ＮＡＭＥＤＲＯＰ</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,700;1,400&family=Noto+Serif+JP:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:      #f5efe6;
    --bg2:     #ede3d6;
    --bg3:     #e3d4c0;
    --surface: #faf6f0;
    --border:  #d4c4ae;
    --border2: #c4b09a;
    --ink:     #2a1f14;
    --ink2:    #5a4535;
    --muted:   #9a8472;
    --accent:  #b85c2a;
    --rust:    #8b3a1e;
    --ochre:   #c49a3c;
    --teal:    #2a6b6b;
    --shadow:  rgba(42,31,20,0.08);
    --shadow2: rgba(42,31,20,0.16);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Space Mono', monospace;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    overflow-x: hidden;
  }
  
  .container {
    max-width: 1340px;
    margin: 0 auto;
    padding: 0 28px 80px;
  }

  /* ── HEADER ── */
  header {
    padding: 52px 0 36px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 20px;
    border-bottom: 1.5px solid var(--border2);
    margin-bottom: 32px;
    flex-wrap: wrap;
  }

  .header-left {
    flex: 1;
    min-width: 280px;
  }

  .header-eyebrow {
    font-family: 'Noto Serif JP', serif;
    font-size: 11px;
    letter-spacing: 5px;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .header-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(38px, 6vw, 74px);
    font-weight: 700;
    letter-spacing: -1px;
    color: var(--ink);
    line-height: 0.93;
  }
  
  .header-title .drop { color: var(--accent); }

  .header-sub {
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--muted);
    margin-top: 11px;
    text-transform: uppercase;
  }

  .header-stats {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
  }
  
  .stat-pill {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  
  .stat-pill .val {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    font-style: italic;
    color: var(--accent);
    letter-spacing: 0;
    margin-right: 4px;
    font-weight: 700;
  }

  /* ── SEARCH SECTION ── */
  .search-section {
    display: flex;
    gap: 10px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }
  
  .search-wrap {
    flex: 1;
    min-width: 200px;
    position: relative;
  }
  
  .search-input {
    width: 100%;
    height: 42px;
    background: var(--surface);
    border: 1.5px solid var(--border);
    padding: 0 42px 0 15px;
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s;
    letter-spacing: 0.3px;
    border-radius: 0;
  }
  
  .search-input::placeholder { color: var(--muted); }
  .search-input:focus { border-color: var(--accent); }
  
  .search-icon {
    position: absolute;
    right: 13px; top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 15px;
    pointer-events: none;
  }

  /* ── BUTTONS ── */
  .btn {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    height: 42px;
    padding: 0 18px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
    border-radius: 0;
    transition: all 0.13s;
    background: transparent;
    border: none;
  }
  
  .btn-ghost {
    border: 1.5px solid var(--border2);
    color: var(--ink2);
  }
  
  .btn-ghost:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(184,92,42,0.06);
  }
  
  .btn-solid {
    background: var(--accent);
    border: 1.5px solid var(--accent);
    color: #fff;
  }
  
  .btn-solid:hover { background: var(--rust); border-color: var(--rust); }

  /* ── TOOLBAR ── */
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  
  .toolbar-left { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .toolbar-right { display: flex; gap: 8px; align-items: center; }

  .result-count {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .result-count span { color: var(--accent); font-weight: 700; }

  /* Custom Sort Strip */
  .sort-widget {
    display: flex;
    align-items: stretch;
    border: 1.5px solid var(--border);
    background: var(--bg2);
    overflow: hidden;
    height: 36px;
  }

  .sort-label {
    font-size: 9px;
    letter-spacing: 2px;
    color: var(--muted);
    padding: 0 11px;
    border-right: 1px solid var(--border);
    display: flex;
    align-items: center;
    white-space: nowrap;
    text-transform: uppercase;
    user-select: none;
  }

  .sort-option {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 0 12px;
    height: 100%;
    cursor: pointer;
    color: var(--muted);
    background: transparent;
    border: none;
    border-right: 1px solid var(--border);
    transition: all 0.13s;
    white-space: nowrap;
  }

  .sort-option:last-child { border-right: none; }
  .sort-option:hover { color: var(--ink); background: var(--bg3); }
  .sort-option.active {
    color: var(--accent);
    background: rgba(184,92,42,0.09);
    font-weight: 700;
  }

  /* View Toggle */
  .view-toggle {
    display: flex;
    border: 1.5px solid var(--border);
    overflow: hidden;
    height: 36px;
  }

  .view-btn {
    width: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    background: transparent;
    border: none;
    border-right: 1px solid var(--border);
    color: var(--muted);
    font-size: 14px;
    transition: all 0.13s;
  }
  .view-btn:last-child { border-right: none; }
  .view-btn:hover { background: var(--bg2); color: var(--ink); }
  .view-btn.active { background: rgba(184,92,42,0.08); color: var(--accent); }

  /* ── FILTER PANEL ── */
  .filter-panel {
    background: var(--surface);
    border: 1.5px solid var(--border);
    padding: 24px;
    margin-bottom: 18px;
    display: none;
  }
  .filter-panel.open { display: block; }

  .filter-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 22px;
    margin-bottom: 18px;
  }

  .filter-group label {
    display: block;
    font-size: 9px;
    letter-spacing: 3px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 9px;
    padding-bottom: 5px;
    border-bottom: 1px solid var(--border);
  }

  .filter-chips { display: flex; flex-wrap: wrap; gap: 5px; }

  .chip {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 1px;
    padding: 4px 9px;
    border: 1.5px solid var(--border);
    cursor: pointer;
    color: var(--ink2);
    background: transparent;
    transition: all 0.12s;
    white-space: nowrap;
  }

  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .filter-divider { height: 1px; background: var(--border); margin: 18px 0; }

  .filter-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .active-filters { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; }

  .active-filter-tag {
    font-size: 10px;
    padding: 3px 10px;
    background: rgba(184,92,42,0.1);
    border: 1px solid rgba(184,92,42,0.3);
    color: var(--accent);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    letter-spacing: 1px;
    transition: background 0.12s;
  }
  .active-filter-tag:hover { background: rgba(184,92,42,0.2); }

  /* ── LAYOUT CONTAINER WRAPPERS ── */
  .names-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 1px;
    background: var(--border);
    border: 1.5px solid var(--border);
    margin-bottom: 40px;
  }

  .names-list {
    display: flex;
    flex-direction: column;
    border: 1.5px solid var(--border);
    margin-bottom: 40px;
  }

  /* ── GRID CARD ── */
  .name-card {
    background: var(--surface);
    padding: 20px;
    cursor: pointer;
    transition: background 0.13s;
    position: relative;
    user-select: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 160px;
  }
  
  .name-card:hover { background: var(--bg2); }

  .card-body-wrap {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding-right: 44px; /* Room for contextual visual elements/action margins */
  }

  .card-title {
    font-family: 'Playfair Display', serif;
    font-size: 17px;
    font-weight: 700;
    color: var(--ink);
    line-height: 1.25;
  }
  
  .card-meta { display: flex; flex-wrap: wrap; gap: 5px; }

  .badge {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 1.5px;
    padding: 3px 8px;
    text-transform: uppercase;
  }

  .badge-category { background: rgba(139,58,30,0.1);  color: var(--rust); }
  .badge-mood     { background: rgba(196,154,60,0.13); color: #7a5f1a; }
  .badge-style    { background: rgba(42,107,107,0.1);  color: var(--teal); }
  .badge-length   { background: rgba(42,31,20,0.06);   color: var(--ink2); border: 1px solid var(--border); }

  .card-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }

  .tag {
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 1px;
    padding: 2px 6px;
    border: 1px solid var(--border);
  }

  .card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 11px;
    border-top: 1px solid var(--border);
    margin-top: 14px;
  }
  
  .cid { font-size: 10px; letter-spacing: 2px; color: var(--muted); }

  .copy-hint {
    font-size: 9px;
    letter-spacing: 1.5px;
    color: var(--muted);
    text-transform: uppercase;
    opacity: 0;
    transition: opacity 0.18s;
  }
  
  .name-card:hover .copy-hint { opacity: 1; }

  /* JavaScript Copy Indicator Inlay overlay */
  .copy-flash-overlay {
    position: absolute;
    inset: 0;
    background: rgba(184,92,42,0.11);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    letter-spacing: 3px;
    color: var(--accent);
    text-transform: uppercase;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.12s;
    z-index: 5;
  }
  .name-card.flash .copy-flash-overlay,
  .list-row.flash .copy-flash-overlay { opacity: 1; }

  /* ── LIST ROW ── */
  .list-row {
    background: var(--surface);
    padding: 13px 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 16px;
    border-bottom: 1px solid var(--border);
    transition: background 0.12s;
    user-select: none;
    position: relative;
  }

  .list-row:last-child { border-bottom: none; }
  .list-row:hover { background: var(--bg2); }

  .list-title {
    font-family: 'Playfair Display', serif;
    font-size: 16px;
    font-weight: 700;
    color: var(--ink);
    flex: 1;
  }

  .list-id {
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--muted);
    flex-shrink: 0;
  }

  .list-copy {
    font-size: 9px;
    letter-spacing: 1.5px;
    color: var(--muted);
    text-transform: uppercase;
    opacity: 0;
    transition: opacity 0.15s;
    flex-shrink: 0;
  }
  
  .list-row:hover .list-copy { opacity: 1; }

  /* ── EMPTY STATE ── */
  .empty-state {
    padding: 70px 20px;
    text-align: center;
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    background: var(--surface);
    grid-column: 1 / -1;
  }
  .empty-state .e-icon { font-size: 24px; margin-bottom: 8px; color: var(--border2); }

  /* ── MODAL ── */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(245,239,230,0.78);
    backdrop-filter: blur(6px);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.22s;
  }

  .modal-overlay.open { opacity: 1; pointer-events: all; }

  .modal {
    background: var(--surface);
    border: 1.5px solid var(--border2);
    width: 100%;
    max-width: 500px;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 20px 60px var(--shadow2);
    transform: translateY(14px);
    transition: transform 0.22s;
  }

  .modal-overlay.open .modal { transform: translateY(0); }

  .modal-header {
    padding: 22px 26px 16px;
    border-bottom: 1.5px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .modal-title {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--ink);
  }

  .modal-close {
    background: none;
    border: none;
    font-size: 17px;
    color: var(--muted);
    cursor: pointer;
    width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    transition: color 0.13s;
  }
  .modal-close:hover { color: var(--accent); }

  .modal-body { padding: 22px 26px; }
  .form-group { margin-bottom: 16px; }

  .form-label {
    display: block;
    font-size: 10px;
    letter-spacing: 2.5px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .form-hint {
    font-size: 10px;
    color: var(--muted);
    margin-top: 4px;
    letter-spacing: 0.3px;
    line-height: 1.5;
  }

  .form-input {
    width: 100%;
    background: var(--bg);
    border: 1.5px solid var(--border);
    padding: 9px 13px;
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    color: var(--ink);
    outline: none;
    transition: border-color 0.13s;
    border-radius: 0;
  }

  .form-input:focus { border-color: var(--accent); }
  .form-input[readonly] { opacity: 0.5; cursor: default; background: var(--bg2); }

  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }

  .len-preview {
    font-size: 10px;
    color: var(--teal);
    letter-spacing: 2px;
    margin-top: 4px;
    text-transform: uppercase;
  }

  .modal-footer {
    padding: 14px 26px 22px;
    border-top: 1.5px solid var(--border);
    display: flex;
    gap: 8px;
    justify-content: flex-end;
  }

  /* ── CONTEXT MENU ── */
  .ctx-menu {
    position: fixed;
    background: var(--surface);
    border: 1.5px solid var(--border2);
    z-index: 200;
    min-width: 140px;
    box-shadow: 0 8px 24px var(--shadow2);
    display: none;
  }

  .ctx-menu.open { display: block; }

  .ctx-item {
    display: block;
    width: 100%;
    text-align: left;
    padding: 10px 16px;
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 1.5px;
    color: var(--ink2);
    background: none;
    border: none;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: all 0.1s;
    text-transform: uppercase;
  }

  .ctx-item:last-child { border-bottom: none; }
  .ctx-item:hover { background: var(--bg2); color: var(--accent); }
  .ctx-item.danger:hover { background: rgba(139,58,30,0.08); color: var(--rust); }

  /* ── TOAST ── */
  .toast {
    position: fixed;
    bottom: 28px; left: 50%;
    transform: translateX(-50%) translateY(56px);
    background: var(--ink);
    color: var(--bg);
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    padding: 11px 22px;
    z-index: 300;
    opacity: 0;
    transition: all 0.22s;
    white-space: nowrap;
  }

  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

  /* Custom System Scrollbars */
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: var(--bg2); }
  ::-webkit-scrollbar-thumb { background: var(--border2); }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

  @media (max-width: 620px) {
    .form-row { grid-template-columns: 1fr; }
    .names-grid { grid-template-columns: 1fr; }
    header { flex-direction: column; align-items: flex-start; }
    .header-stats { align-items: flex-start; flex-direction: row; gap: 16px; margin-top: 12px;}
    .sort-label { display: none; }
  }
</style>
</head>
<body>
<div class="container">

  <header>
    <div class="header-left">
      <div class="header-eyebrow">名前のアーカイブ · Name Archive System</div>
      <h1 class="header-title">ＮＡＭＥ<span class="drop">ＤＲＯＰ</span></h1>
      <div class="header-sub">Project name database · Archive edition</div>
    </div>
    <div class="header-stats">
      <div class="stat-pill">ENTRIES <span class="val" id="stat-total">0</span></div>
      <div class="stat-pill">SHOWN <span class="val" id="stat-filtered">0</span></div>
      <div class="stat-pill">TAGS <span class="val" id="stat-tags">0</span></div>
    </div>
  </header>

  <div class="search-section">
    <div class="search-wrap">
      <input type="text" class="search-input" id="search-input" placeholder="Search names, categories, moods, tags...">
      <span class="search-icon">⌕</span>
    </div>
    <button class="btn btn-ghost" id="filter-toggle">⊞ Filters</button>
    <button class="btn btn-solid" id="add-btn">+ New Entry</button>
  </div>

  <div class="toolbar">
    <div class="toolbar-left">
      <div class="sort-widget">
        <span class="sort-label">Sort</span>
        <button class="sort-option active" data-sort="default">Default</button>
        <button class="sort-option" data-sort="alpha-asc">A → Z</button>
        <button class="sort-option" data-sort="alpha-desc">Z → A</button>
        <button class="sort-option" data-sort="len-asc">Short →</button>
        <button class="sort-option" data-sort="len-desc">→ Long</button>
        <button class="sort-option" data-sort="newest">Newest</button>
      </div>
    </div>
    <div class="toolbar-right">
      <span class="result-count">Showing <span id="rc-filtered">0</span> of <span id="rc-total">0</span> entries</span>
      <div class="view-toggle">
        <button class="view-btn active" id="view-grid" title="Grid">⊞</button>
        <button class="view-btn" id="view-list" title="List">☰</button>
      </div>
    </div>
  </div>

  <div class="filter-panel" id="filter-panel">
    <div class="filter-grid">
      <div class="filter-group">
        <label>Category</label>
        <div class="filter-chips" id="fc-category"></div>
      </div>
      <div class="filter-group">
        <label>Mood</label>
        <div class="filter-chips" id="fc-mood"></div>
      </div>
      <div class="filter-group">
        <label>Style</label>
        <div class="filter-chips" id="fc-style"></div>
      </div>
      <div class="filter-group">
        <label>Length</label>
        <div class="filter-chips" id="fc-length"></div>
      </div>
    </div>
    <div class="filter-divider"></div>
    <div class="filter-group">
      <label>Tags</label>
      <div class="filter-chips" id="fc-tags"></div>
    </div>
    <div class="filter-divider"></div>
    <div class="filter-actions">
      <div class="active-filters" id="active-filters"></div>
      <button class="btn btn-ghost" style="height:32px;" id="clear-filters">✕ Clear</button>
    </div>
  </div>

  <div id="names-container" class="names-grid"></div>

</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modal-title">New Entry</span>
      <button class="modal-close" id="modal-close">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">Title *</label>
        <input type="text" class="form-input" id="f-title" placeholder="e.g. Synthetic Entrance">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Category *</label>
          <input type="text" class="form-input" id="f-category" placeholder="Technical, Atmospheric…">
          <div class="form-hint">Free text — creates new categories</div>
        </div>
        <div class="form-group">
          <label class="form-label">Mood *</label>
          <input type="text" class="form-input" id="f-mood" placeholder="Dreamy, Eerie, Hopeful…">
          <div class="form-hint">Any mood descriptor</div>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Style</label>
          <input type="text" class="form-input" id="f-style" placeholder="Glitch, Formal, Casual…">
        </div>
        <div class="form-group">
          <label class="form-label">Length</label>
          <input type="text" class="form-input" id="f-length" readonly placeholder="Auto-detected">
          <div class="len-preview" id="len-preview"></div>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Tags <span style="font-size:9px;letter-spacing:0;color:var(--muted)">(comma-separated)</span></label>
        <input type="text" class="form-input" id="f-tags" placeholder="cyber, retro, nostalgia">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="modal-cancel">Cancel</button>
      <button class="btn btn-solid" id="modal-save">Save Entry</button>
    </div>
  </div>
</div>

<div class="ctx-menu" id="ctx-menu">
  <button class="ctx-item" id="ctx-edit">✎  Edit</button>
  <button class="ctx-item danger" id="ctx-delete">⊗  Delete</button>
</div>

<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════════════════
// DATASET
// ═══════════════════════════════════════════════════
const BASE_DB = [
  { id:1,  title:"Synthetic Entrance",      category:"Technical",     mood:"Mysterious",  style:"Creative",     tags:["cyber","tech","entry"],                added:1714000000000 },
  { id:2,  title:"Cherry Cola Skies",       category:"Atmospheric",   mood:"Dreamy",      style:"Casual",       tags:["retro","sky","pastel","nostalgia"],      added:1714086400000 },
  { id:3,  title:"Counting Constellations", category:"Atmospheric",   mood:"Melancholic", style:"Creative",     tags:["space","night","poetic"],               added:1714172800000 },
  { id:4,  title:"C0d3r's Paradox",         category:"Technical",     mood:"Analytical",  style:"Glitch",       tags:["code","cyber","glitch","leet"],         added:1714259200000 },
  { id:5,  title:"Neon Meridian",           category:"Atmospheric",   mood:"Energetic",   style:"Creative",     tags:["neon","retro","city","cyber"],          added:1714345600000 },
  { id:6,  title:"Protocol Horizon",        category:"Technical",     mood:"Mysterious",  style:"Professional", tags:["tech","network","future"],             added:1714432000000 },
  { id:7,  title:"Glass Frequencies",       category:"Creative",      mood:"Dreamy",      style:"Creative",     tags:["music","ethereal","analog"],            added:1714518400000 },
  { id:8,  title:"Terminal Bloom",          category:"Hybrid",        mood:"Nostalgic",   style:"Creative",     tags:["code","nature","contrast","retro"],     added:1714604800000 },
  { id:9,  title:"Cascade Index",           category:"Institutional", mood:"Analytical",  style:"Formal",       tags:["data","system","order"],               added:1714691200000 },
  { id:10, title:"Velvet Algorithm",        category:"Technical",     mood:"Mysterious",  style:"Creative",     tags:["luxury","code","soft","cyber"],         added:1714777600000 },
  { id:11, title:"Midnight Compile",        category:"Technical",     mood:"Melancholic", style:"Casual",       tags:["code","night","dev","late-night"],      added:1714864000000 },
  { id:12, title:"Pastel Override",         category:"Creative",      mood:"Energetic",   style:"Glitch",       tags:["pastel","retro","cyber","override"],    added:1714950400000 },
  { id:13, title:"Signal Lost",             category:"Atmospheric",   mood:"Eerie",       style:"Creative",     tags:["analog","signal","nostalgia","broken"], added:1715036800000 },
  { id:14, title:"Datawave Reverie",        category:"Hybrid",        mood:"Dreamy",      style:"Creative",     tags:["data","wave","dream","retro"],          added:1715123200000 },
  { id:15, title:"The Archive Speaks",      category:"Institutional", mood:"Mysterious",  style:"Formal",       tags:["archive","history","memory","system"],  added:1715209600000 },
  { id:16, title:"Pink Noise Garden",       category:"Atmospheric",   mood:"Dreamy",      style:"Creative",     tags:["pink","nature","sound","ambient"],      added:1715296000000 },
  { id:17, title:"Recursion Sunset",        category:"Technical",     mood:"Melancholic", style:"Creative",     tags:["code","sky","loop","poetic"],           added:1715382400000 },
  { id:18, title:"Mall Cop Frequency",      category:"Creative",      mood:"Nostalgic",   style:"Casual",       tags:["retro","90s","mall","irony"],           added:1715468800000 },
  { id:19, title:"Liminal Loop",            category:"Atmospheric",   mood:"Eerie",       style:"Creative",     tags:["liminal","loop","void","space"],        added:1715555200000 },
  { id:20, title:"Quantum Drift",           category:"Technical",     mood:"Mysterious",  style:"Professional", tags:["quantum","drift","physics","future"],   added:1715641600000 },
];

let runtime = [];
let deletedIds = new Set();
let nextId = BASE_DB.length + 1;

function allEntries() {
  const base = BASE_DB.filter(e => !deletedIds.has(e.id));
  return [...base, ...runtime];
}

// ═══════════════════════════════════
// STATE
// ═══════════════════════════════════
let currentView = 'grid';
let currentSort = 'default';
let activeFilters = { category:[], mood:[], style:[], length:[], tags:[] };
let editingId = null;
let ctxTargetId = null;

// ═══════════════════════════════════
// HELPERS
// ═══════════════════════════════════
function wordLen(title) {
  const w = title.trim().split(/\s+/).length;
  if (w <= 2) return 'Short (1–2)';
  if (w === 3) return 'Medium (3)';
  return 'Long (4+)';
}

function getAllTags() {
  const s = new Set();
  allEntries().forEach(e => (e.tags||[]).forEach(t => s.add(t)));
  return [...s].sort();
}

function uniqueVals(key) {
  return [...new Set(allEntries().map(e => e[key]).filter(Boolean))].sort();
}

function getEntry(id) { return allEntries().find(e => e.id === id); }

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 2100);
}

function flashCard(id) {
  const el = document.querySelector(`[data-id="${id}"]`);
  if (!el) return;
  el.classList.add('flash');
  setTimeout(() => el.classList.remove('flash'), 550);
}

function esc(s) {
  return s.replace(/'/g, "\\'").replace(/"/g, '&quot;');
}

// ═══════════════════════════════════
// FILTER CHIPS
// ═══════════════════════════════════
function buildChips() {
  buildGroup('fc-category', uniqueVals('category'), 'category');
  buildGroup('fc-mood',     uniqueVals('mood'),     'mood');
  buildGroup('fc-style',    uniqueVals('style'),    'style');
  buildGroup('fc-length',   ['Short (1–2)', 'Medium (3)', 'Long (4+)'], 'length');

  const tw = document.getElementById('fc-tags');
  tw.innerHTML = '';
  getAllTags().forEach(t => {
    tw.appendChild(chip('#' + t, activeFilters.tags.includes(t), () => toggleFilter('tags', t)));
  });

  renderActiveFilters();
}

function buildGroup(elId, vals, type) {
  const w = document.getElementById(elId);
  w.innerHTML = '';
  vals.forEach(v => w.appendChild(chip(v, activeFilters[type].includes(v), () => toggleFilter(type, v))));
}

function chip(label, isActive, onClick) {
  const b = document.createElement('button');
  b.className = 'chip' + (isActive ? ' active' : '');
  b.textContent = label;
  b.onclick = onClick;
  return b;
}

function toggleFilter(type, val) {
  const arr = activeFilters[type];
  const i = arr.indexOf(val);
  if (i >= 0) arr.splice(i, 1); else arr.push(val);
  buildChips();
  render();
}

function renderActiveFilters() {
  const w = document.getElementById('active-filters');
  w.innerHTML = '';
  Object.entries(activeFilters).forEach(([type, vals]) => {
    vals.forEach(v => {
      const d = document.createElement('div');
      d.className = 'active-filter-tag';
      d.innerHTML = `<span>${type}: ${v}</span> ✕`;
      d.onclick = () => toggleFilter(type, v);
      w.appendChild(d);
    });
  });
}

// ═══════════════════════════════════
// RENDER
// ═══════════════════════════════════
function getFiltered() {
  const q = document.getElementById('search-input').value.toLowerCase().trim();

  let items = allEntries().filter(e => {
    if (q) {
      const hay = [e.title, e.category, e.mood, e.style, ...(e.tags||[])].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    if (activeFilters.category.length && !activeFilters.category.includes(e.category)) return false;
    if (activeFilters.mood.length     && !activeFilters.mood.includes(e.mood))         return false;
    if (activeFilters.style.length    && !activeFilters.style.includes(e.style))       return false;
    if (activeFilters.length.length   && !activeFilters.length.includes(wordLen(e.title))) return false;
    if (activeFilters.tags.length     && !activeFilters.tags.some(t => (e.tags||[]).includes(t))) return false;
    return true;
  });

  const s = currentSort;
  if (s === 'alpha-asc')  items.sort((a,b) => a.title.localeCompare(b.title));
  if (s === 'alpha-desc') items.sort((a,b) => b.title.localeCompare(a.title));
  if (s === 'len-asc')    items.sort((a,b) => a.title.length - b.title.length);
  if (s === 'len-desc')   items.sort((a,b) => b.title.length - a.title.length);
  if (s === 'newest')     items.sort((a,b) => b.added - a.added);

  return items;
}

function render() {
  const items = getFiltered();
  const all   = allEntries();

  document.getElementById('stat-total').textContent    = all.length;
  document.getElementById('stat-filtered').textContent = items.length;
  document.getElementById('stat-tags').textContent     = getAllTags().length;
  document.getElementById('rc-filtered').textContent   = items.length;
  document.getElementById('rc-total').textContent      = all.length;

  const c = document.getElementById('names-container');

  if (currentView === 'grid') {
    c.className = 'names-grid';
    c.innerHTML = items.length ? items.map(gridCard).join('') : emptyHTML();
  } else {
    c.className = 'names-list';
    c.innerHTML = items.length ? items.map(listRow).join('') : emptyHTML();
  }

  buildChips();
}

function emptyHTML() {
  return `<div class="empty-state"><div class="e-icon">◈</div>No entries match your filters</div>`;
}

function gridCard(e) {
  const tags = (e.tags||[]).map(t => `<span class="tag">#${t}</span>`).join('');
  return `<div class="name-card" data-id="${e.id}" onclick="copyEntry(${e.id})" oncontextmenu="openCtx(event,${e.id})">
    <div class="card-body-wrap">
      <div class="card-title">${e.title}</div>
      <div class="card-meta">
        ${e.category ? `<span class="badge badge-category">${e.category}</span>` : ''}
        ${e.mood     ? `<span class="badge badge-mood">${e.mood}</span>`         : ''}
        ${e.style    ? `<span class="badge badge-style">${e.style}</span>`       : ''}
      </div>
      ${tags ? `<div class="card-tags">${tags}</div>` : ''}
    </div>
    <div class="card-footer">
      <span class="cid">ID·${String(e.id).padStart(4,'0')}</span>
      <span class="badge badge-length">${wordLen(e.title)}</span>
      <span class="copy-hint">click to copy</span>
    </div>
    <div class="copy-flash-overlay">Copied!</div>
  </div>`;
}

function listRow(e) {
  return `<div class="list-row" data-id="${e.id}" onclick="copyEntry(${e.id})" oncontextmenu="openCtx(event,${e.id})">
    <span class="list-title">${e.title}</span>
    <span class="list-id">ID·${String(e.id).padStart(4,'0')}</span>
    <span class="list-copy">copy</span>
    <div class="copy-flash-overlay">Copied!</div>
  </div>`;
}

// ═══════════════════════════════════
// COPY ON CLICK
// ═══════════════════════════════════
function copyEntry(id) {
  const e = getEntry(id);
  if (!e) return;
  navigator.clipboard.writeText(e.title).catch(() => {});
  flashCard(id);
  showToast('Copied: ' + e.title);
}

// ═══════════════════════════════════
// CONTEXT MENU
// ═══════════════════════════════════
function openCtx(evt, id) {
  evt.preventDefault();
  evt.stopPropagation();
  ctxTargetId = id;
  const m = document.getElementById('ctx-menu');
  m.style.left = Math.min(evt.clientX, window.innerWidth  - 150) + 'px';
  m.style.top  = Math.min(evt.clientY, window.innerHeight - 80)  + 'px';
  m.classList.add('open');
}

function closeCtx() { document.getElementById('ctx-menu').classList.remove('open'); }

document.addEventListener('click', closeCtx);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeCtx(); closeModal(); }
});

document.getElementById('ctx-edit').onclick = ev => {
  ev.stopPropagation();
  closeCtx();
  openEdit(ctxTargetId);
};

document.getElementById('ctx-delete').onclick = ev => {
  ev.stopPropagation();
  closeCtx();
  deleteEntry(ctxTargetId);
};

// ═══════════════════════════════════
// EDIT / DELETE
// ═══════════════════════════════════
function deleteEntry(id) {
  if (!confirm('Delete this entry?')) return;
  const ri = runtime.findIndex(e => e.id === id);
  if (ri >= 0) runtime.splice(ri, 1);
  else deletedIds.add(id);
  render();
  showToast('Entry deleted');
}

function openEdit(id) {
  const e = getEntry(id);
  if (!e) return;
  editingId = id;
  document.getElementById('modal-title').textContent = 'Edit Entry';
  document.getElementById('f-title').value    = e.title;
  document.getElementById('f-category').value = e.category || '';
  document.getElementById('f-mood').value     = e.mood || '';
  document.getElementById('f-style').value    = e.style || '';
  document.getElementById('f-tags').value     = (e.tags||[]).join(', ');
  updateLenPreview();
  openModal();
}

// ═══════════════════════════════════
// MODAL
// ═══════════════════════════════════
function openModal() { document.getElementById('modal-overlay').classList.add('open'); }

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  editingId = null;
  ['f-title','f-category','f-mood','f-style','f-tags','f-length'].forEach(id => {
    document.getElementById(id).value = '';
  });
  document.getElementById('modal-title').textContent = 'New Entry';
  document.getElementById('len-preview').textContent = '';
}

function updateLenPreview() {
  const v = document.getElementById('f-title').value;
  const computed = v.trim() ? wordLen(v) : '';
  document.getElementById('f-length').value = computed;
  document.getElementById('len-preview').textContent = computed;
}

function saveEntry() {
  const title    = document.getElementById('f-title').value.trim();
  const category = document.getElementById('f-category').value.trim();
  const mood     = document.getElementById('f-mood').value.trim();
  const style    = document.getElementById('f-style').value.trim();
  const tags     = document.getElementById('f-tags').value.split(',').map(t => t.trim().toLowerCase()).filter(Boolean);

  if (!title)    { showToast('Title is required');    return; }
  if (!category) { showToast('Category is required'); return; }
  if (!mood)     { showToast('Mood is required');     return; }

  if (editingId) {
    let entry = runtime.find(e => e.id === editingId)
             || BASE_DB.find(e => e.id === editingId);
    if (entry) Object.assign(entry, { title, category, mood, style, tags });
    showToast('Entry updated');
  } else {
    runtime.push({ id: nextId++, title, category, mood, style, tags, added: Date.now() });
    showToast('Added: ' + title);
  }

  closeModal();
  render();
}

// ═══════════════════════════════════
// EVENTS
// ═══════════════════════════════════
document.getElementById('search-input').addEventListener('input', render);

document.querySelectorAll('.sort-option').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.sort-option').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentSort = btn.dataset.sort;
    render();
  });
});

document.getElementById('filter-toggle').onclick = () =>
  document.getElementById('filter-panel').classList.toggle('open');

document.getElementById('clear-filters').onclick = () => {
  activeFilters = { category:[], mood:[], style:[], length:[], tags:[] };
  buildChips();
  render();
};

document.getElementById('add-btn').onclick = () => { editingId = null; openModal(); };
document.getElementById('modal-close').onclick = closeModal;
document.getElementById('modal-cancel').onclick = closeModal;
document.getElementById('modal-save').onclick = saveEntry;
document.getElementById('f-title').addEventListener('input', updateLenPreview);

document.getElementById('modal-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
});

document.getElementById('view-grid').onclick = () => {
  currentView = 'grid';
  document.getElementById('view-grid').classList.add('active');
  document.getElementById('view-list').classList.remove('active');
  render();
};

document.getElementById('view-list').onclick = () => {
  currentView = 'list';
  document.getElementById('view-list').classList.add('active');
  document.getElementById('view-grid').classList.remove('active');
  render();
};

// INIT
buildChips();
render();
</script>
</body>
</html>
