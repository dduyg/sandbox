<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ｎamedrop</title>
<link href="https://fonts.cdnfonts.com/css/dellmonte-sans" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Orbitron:wght@400;700;900&family=Noto+Serif+JP:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f1ff;
  --bg2:rgba(255,255,255,0.65);
  --bg3:#ffffff;
  --amber:#ff6ec7;
  --amber2:#8a5cff;
  --rust:#ff7aa2;
  --sage:#4dd6b6;
  --slate:#7aa0ff;
  --text:#2b2b3a;
  --muted:#6b6f8a;
  --border:rgba(138,92,255,0.18);
  --border2:rgba(57,213,255,0.10);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Space Mono', monospace;
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
  background:
    linear-gradient(
      135deg,
      #f6f1ff 0%,
      #fdf2ff 25%,
      #eaf7ff 50%,
      #fff0f6 75%,
      #f6f1ff 100%
    );
}

body::before{
  content:'';
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle, rgba(255,110,199,0.10) 1px, transparent 1px),
    radial-gradient(circle, rgba(57,213,255,0.08) 1px, transparent 1px);
  background-size:28px 28px, 36px 36px;
  pointer-events:none;
  z-index:0;
}

.container{
  position:relative;
  z-index:1;
  max-width:1300px;
  margin:0 auto;
  padding:0 28px;
}

/* HEADER */

header{
  padding:52px 0 36px;
  text-align:center;
  border-bottom:1px solid var(--border2);
  margin-bottom:36px;
}

.header-eyebrow{
  font-family:'Noto Serif JP', serif;
  font-size:11px;
  letter-spacing:6px;
  color:var(--muted);
  text-transform:uppercase;
  margin-bottom:12px;
  opacity:0.8;
}

.header-title{
  font-family:'Dellmonte Sans', sans-serif;
  font-size:clamp(28px, 5vw, 56px);
  font-weight:900;
  letter-spacing:8px;
  color:var(--amber);
  line-height:1;
  margin-bottom:8px;
}

.header-sub{
  font-family:'Noto Serif JP', serif;
  font-size:13px;
  letter-spacing:4px;
  color:var(--muted);
  margin-bottom:20px;
}

.header-stats{
  display:flex;
  justify-content:center;
  gap:32px;
  margin-bottom:15px;
}

.stat-pill{
  font-size:11px;
  letter-spacing:2px;
  color:var(--muted);
}

.stat-pill .val{
  color:var(--amber);
  font-weight:700;
}

/* SEARCH */

.search-section{
  padding-bottom:30px;
}

.search-wrap{
  position:relative;
  max-width:560px;
  margin:0 auto;
}

.search-input{
  width:100%;
  background:var(--bg2);
  border:1px solid var(--border);
  border-top:2px solid var(--amber2);
  padding:13px 44px 13px 18px;
  font-family:'Space Mono', monospace;
  font-size:13px;
  color:var(--text);
  outline:none;
  letter-spacing:1px;
  transition:border-color .2s, box-shadow .2s;
}

.search-input::placeholder{
  color:var(--muted);
}

.search-input:focus{
  border-color:var(--amber);
  box-shadow:0 4px 20px rgba(232,197,71,0.07);
}

.search-icon{
  position:absolute;
  right:15px;
  top:50%;
  transform:translateY(-50%);
  color:var(--amber2);
  font-size:17px;
  pointer-events:none;
}

/* TOOLBAR */

.toolbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  margin-bottom:18px;
  flex-wrap:wrap;
}

.toolbar-left{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

.result-count{
  font-size:10px;
  color:var(--muted);
  letter-spacing:2px;
  white-space:nowrap;
}

.result-count span{
  color:var(--amber);
}

.sort-widget{
  display:flex;
  align-items:stretch;
  border:1px solid var(--border);
  border-radius:2px;
  overflow:hidden;
  font-size:10px;
  letter-spacing:1px;
}

.sort-label{
  padding:7px 10px;
  background:var(--bg3);
  border-right:1px solid var(--border);
  color:var(--muted);
  white-space:nowrap;
  user-select:none;
  display:flex;
  align-items:center;
}

.sort-option{
  padding:0 11px;
  cursor:pointer;
  background:transparent;
  border:none;
  border-right:1px solid var(--border);
  font-family:'Space Mono', monospace;
  font-size:10px;
  letter-spacing:1px;
  color:var(--muted);
  transition:all .12s;
  white-space:nowrap;
  height:100%;
  min-height:32px;
}

.sort-option:last-child{
  border-right:none;
}

.sort-option:hover{
  background:rgba(232,197,71,0.05);
  color:var(--text);
}

.sort-option.active{
  background:rgba(232,197,71,0.1);
  color:var(--amber);
}

.btn{
  font-family:'Space Mono', monospace;
  font-size:10px;
  letter-spacing:2px;
  padding:8px 16px;
  border:1px solid;
  cursor:pointer;
  transition:all .15s;
  text-transform:uppercase;
  background:transparent;
  border-radius:2px;
  white-space:nowrap;
}

.btn-amber{
  border-color:var(--amber);
  color:var(--amber);
}

.btn-amber:hover{
  background:var(--amber);
  color:var(--bg);
}

.btn-rust{
  border-color:var(--rust);
  color:var(--rust);
}

.btn-rust:hover{
  background:var(--rust);
  color:var(--bg);
}

.view-toggle{
  display:flex;
  border:1px solid var(--border);
  border-radius:2px;
  overflow:hidden;
}

.view-btn{
  background:transparent;
  border:none;
  border-right:1px solid var(--border);
  color:var(--muted);
  padding:8px 13px;
  cursor:pointer;
  font-size:13px;
  transition:all .12s;
}

.view-btn:last-child{
  border-right:none;
}

.view-btn.active{
  background:rgba(232,197,71,0.1);
  color:var(--amber);
}

/* GRID */

.names-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(270px, 1fr));
  gap:12px;
  margin-bottom:48px;
}

/* LIST */

.names-list{
  display:flex;
  flex-direction:column;
  gap:2px;
  margin-bottom:48px;
}

/* GRID CARD */

.name-card{
  background:var(--bg2);
  border:1px solid var(--border2);
  padding:20px;
  cursor:pointer;
  transition:all .16s;
  display:flex;
  flex-direction:column;
  gap:11px;
  position:relative;
  overflow:hidden;
  user-select:none;
}

.name-card::after{
  content:'';
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  height:2px;
  background:linear-gradient(90deg, var(--amber2), var(--amber));
  transform:scaleX(0);
  transform-origin:left;
  transition:transform .2s;
}

.name-card:hover{
  border-color:rgba(232,197,71,0.28);
  background:var(--bg3);
}

.name-card:hover::after{
  transform:scaleX(1);
}

.name-card.flash{
  background:rgba(232,197,71,0.07);
  border-color:var(--amber);
}

.card-title{
  font-family:'Orbitron', sans-serif;
  font-size:14px;
  font-weight:700;
  letter-spacing:1.5px;
  color:var(--text);
  line-height:1.3;
}

.card-meta{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  align-items:center;
}

.badge{
  font-size:8px;
  letter-spacing:2px;
  padding:3px 7px;
  border-radius:1px;
  text-transform:uppercase;
  font-weight:700;
}

.badge-category{
  background:rgba(232,197,71,0.1);
  color:var(--amber2);
  border:1px solid rgba(232,197,71,0.2);
}

.badge-mood{
  background:rgba(122,171,138,0.1);
  color:var(--sage);
  border:1px solid rgba(122,171,138,0.2);
}

.badge-style{
  background:rgba(143,163,184,0.1);
  color:var(--slate);
  border:1px solid rgba(143,163,184,0.2);
}

.badge-length{
  background:rgba(196,91,58,0.08);
  color:var(--rust);
  border:1px solid rgba(196,91,58,0.2);
}

.card-tags{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
}

.tag{
  font-size:9px;
  color:var(--muted);
  padding:2px 6px;
  border:1px solid rgba(90,100,114,0.25);
  letter-spacing:1px;
}

.card-footer{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:9px;
  color:var(--muted);
  border-top:1px solid var(--border2);
  padding-top:10px;
  letter-spacing:2px;
}

/* LIST ROW */

.list-row{
  display:flex;
  align-items:center;
  gap:20px;
  padding:11px 16px;
  background:var(--bg2);
  border:1px solid var(--border2);
  cursor:pointer;
  transition:all .12s;
  user-select:none;
}

.list-row:hover{
  background:var(--bg3);
  border-color:rgba(232,197,71,0.22);
}

.list-row.flash{
  background:rgba(232,197,71,0.06);
  border-color:var(--amber);
}

.list-title{
  font-family:'Orbitron', sans-serif;
  font-size:13px;
  font-weight:700;
  letter-spacing:1.5px;
  color:var(--text);
  flex:1;
  min-width:0;
}

.list-copy{
  font-size:9px;
  color:var(--muted);
  letter-spacing:2px;
  flex-shrink:0;
}

/* EMPTY */

.empty-state{
  text-align:center;
  padding:80px 20px;
  color:var(--muted);
  grid-column:1 / -1;
}

.empty-state .e-icon{
  font-size:36px;
  opacity:0.2;
  margin-bottom:14px;
}

.empty-state p{
  font-size:10px;
  letter-spacing:3px;
  text-transform:uppercase;
}

/* TOAST */

.toast{
  position:fixed;
  bottom:24px;
  left:50%;
  transform:translateX(-50%) translateY(60px);
  background:var(--bg3);
  border:1px solid var(--amber);
  padding:10px 22px;
  font-size:10px;
  color:var(--amber);
  letter-spacing:3px;
  z-index:300;
  opacity:0;
  transition:all .22s;
  white-space:nowrap;
}

.toast.show{
  transform:translateX(-50%) translateY(0);
  opacity:1;
}

::-webkit-scrollbar{
  width:5px;
}

::-webkit-scrollbar-track{
  background:var(--bg);
}

::-webkit-scrollbar-thumb{
  background:rgba(232,197,71,0.18);
}

::-webkit-scrollbar-thumb:hover{
  background:rgba(232,197,71,0.38);
}

@media (max-width:620px){
  .names-grid{
    grid-template-columns:1fr;
  }

  .sort-option{
    padding:0 7px;
    font-size:9px;
  }
}
</style>
</head>

<body>

<div class="container">

  <header>
    <div class="header-eyebrow">ネーミングデータベースアーカイブ · v2.0</div>

    <h1 class="header-title">ＮＡＭＥＤＲＯＰ</h1>

    <div class="header-sub">
      名前のアーカイブ — Name Archive System
    </div>

    <div class="header-stats">
      <div class="stat-pill">
        ENTRIES <span class="val" id="stat-total">0</span>
      </div>

      <div class="stat-pill">
        FILTERED <span class="val" id="stat-filtered">0</span>
      </div>

      <div class="stat-pill">
        TAGS <span class="val" id="stat-tags">0</span>
      </div>
    </div>
  </header>

  <div class="search-section">
    <div class="search-wrap">
      <input
        type="text"
        class="search-input"
        id="search-input"
        placeholder="Search..."
      />
      <span class="search-icon">⌕</span>
    </div>
  </div>

  <div class="toolbar">

    <div class="toolbar-left">

      <div class="sort-widget">
        <span class="sort-label">SORT</span>

        <button class="sort-option active" data-sort="default">
          DEFAULT
        </button>

        <button class="sort-option" data-sort="alpha-asc">
          A→Z
        </button>

        <button class="sort-option" data-sort="alpha-desc">
          Z→A
        </button>

        <button class="sort-option" data-sort="len-asc">
          LEN↑
        </button>

        <button class="sort-option" data-sort="len-desc">
          LEN↓
        </button>

        <button class="sort-option" data-sort="newest">
          NEW
        </button>
      </div>

      <span class="result-count">
        SHOWING
        <span id="rc-filtered">0</span>
        OF
        <span id="rc-total">0</span>
      </span>

    </div>

    <div style="display:flex;gap:8px;align-items:center;">

      <div class="view-toggle">
        <button class="view-btn active" id="view-grid">⊞</button>
        <button class="view-btn" id="view-list">☰</button>
      </div>

    </div>

  </div>

  <div id="names-container"></div>

</div>

<div class="toast" id="toast"></div>

<script>

const BASE_DB = [
  {
    id:1,
    title:"Synthetic Entrance",
    category:"Technical",
    mood:"Mysterious",
    style:"Creative",
    tags:["cyber","tech","entry"],
    added:1714000000000
  },
  {
    id:2,
    title:"Cherry Cola Skies",
    category:"Atmospheric",
    mood:"Dreamy",
    style:"Casual",
    tags:["retro","sky","pastel","nostalgia"],
    added:1714086400000
  },
  {
    id:3,
    title:"Counting Constellations",
    category:"Atmospheric",
    mood:"Melancholic",
    style:"Creative",
    tags:["space","night","poetic"],
    added:1714172800000
  },
  {
    id:4,
    title:"C0d3r's Paradox",
    category:"Technical",
    mood:"Analytical",
    style:"Glitch",
    tags:["code","cyber","glitch","leet"],
    added:1714259200000
  },
  {
    id:5,
    title:"Neon Meridian",
    category:"Atmospheric",
    mood:"Energetic",
    style:"Creative",
    tags:["neon","retro","city","cyber"],
    added:1714345600000
  }
];

let currentView = "grid";
let currentSort = "default";

function allEntries(){
  return BASE_DB;
}

function getFiltered(){

  const q = document
    .getElementById("search-input")
    .value
    .toLowerCase()
    .trim();

  let items = allEntries().filter(e => {

    if(q){

      const hay = [
        e.title,
        e.category,
        e.mood,
        e.style,
        ...(e.tags || [])
      ]
      .join(" ")
      .toLowerCase();

      if(!hay.includes(q)) return false;
    }

    return true;
  });

  if(currentSort === "alpha-asc"){
    items.sort((a,b)=>a.title.localeCompare(b.title));
  }

  if(currentSort === "alpha-desc"){
    items.sort((a,b)=>b.title.localeCompare(a.title));
  }

  if(currentSort === "len-asc"){
    items.sort((a,b)=>a.title.length - b.title.length);
  }

  if(currentSort === "len-desc"){
    items.sort((a,b)=>b.title.length - a.title.length);
  }

  if(currentSort === "newest"){
    items.sort((a,b)=>b.added - a.added);
  }

  return items;
}

function wordLen(title){

  const w = title.trim().split(/\s+/).length;

  if(w <= 2) return "Short (1–2)";
  if(w === 3) return "Medium (3)";
  return "Long (4+)";
}

function getAllTags(){

  const s = new Set();

  allEntries().forEach(e => {
    (e.tags || []).forEach(t => s.add(t));
  });

  return [...s];
}

function showToast(msg){

  const t = document.getElementById("toast");

  t.textContent = msg;

  t.classList.add("show");

  clearTimeout(t._t);

  t._t = setTimeout(()=>{
    t.classList.remove("show");
  }, 1600);
}

function flashCard(id){

  const el = document.querySelector(`[data-id="${id}"]`);

  if(!el) return;

  el.classList.add("flash");

  setTimeout(()=>{
    el.classList.remove("flash");
  }, 500);
}

function copyEntry(id){

  const e = allEntries().find(x => x.id === id);

  if(!e) return;

  navigator.clipboard.writeText(e.title).catch(()=>{});

  flashCard(id);

  showToast("COPIED — " + e.title);
}

/* UPDATED GRID CARD */

function gridCard(e){

  const tags = (e.tags || [])
    .map(t => `<span class="tag">#${t}</span>`)
    .join('');

  return `
    <div
      class="name-card"
      data-id="${e.id}"
      onclick="copyEntry(${e.id})"
    >

      <div class="card-title">
        ${e.title}
      </div>

      <div class="card-meta">

        ${
          e.category
          ? `<span class="badge badge-category">${e.category}</span>`
          : ''
        }

        ${
          e.mood
          ? `<span class="badge badge-mood">${e.mood}</span>`
          : ''
        }

        ${
          e.style
          ? `<span class="badge badge-style">${e.style}</span>`
          : ''
        }

      </div>

      ${
        tags
        ? `<div class="card-tags">${tags}</div>`
        : ''
      }

      <div class="card-footer">

        <span>
          ID·${String(e.id).padStart(4,'0')}
        </span>

        <span class="badge badge-length">
          ${wordLen(e.title)}
        </span>

      </div>

    </div>
  `;
}

/* UPDATED LIST ROW */

function listRow(e){

  return `
    <div
      class="list-row"
      data-id="${e.id}"
      onclick="copyEntry(${e.id})"
    >

      <span class="list-title">
        ${e.title}
      </span>

      <span class="list-copy">
        ID·${String(e.id).padStart(4,'0')}
      </span>

    </div>
  `;
}

function emptyHTML(){

  return `
    <div class="empty-state">
      <div class="e-icon">◈</div>
      <p>No entries match</p>
    </div>
  `;
}

function render(){

  const items = getFiltered();
  const all = allEntries();

  document.getElementById("stat-total").textContent =
    all.length;

  document.getElementById("stat-filtered").textContent =
    items.length;

  document.getElementById("stat-tags").textContent =
    getAllTags().length;

  document.getElementById("rc-filtered").textContent =
    items.length;

  document.getElementById("rc-total").textContent =
    all.length;

  const c = document.getElementById("names-container");

  if(currentView === "grid"){

    c.className = "names-grid";

    c.innerHTML = items.length
      ? items.map(gridCard).join("")
      : emptyHTML();

  }else{

    c.className = "names-list";

    c.innerHTML = items.length
      ? items.map(listRow).join("")
      : emptyHTML();
  }
}

document
  .getElementById("search-input")
  .addEventListener("input", render);

document
  .querySelectorAll(".sort-option")
  .forEach(btn => {

    btn.addEventListener("click", ()=>{

      document
        .querySelectorAll(".sort-option")
        .forEach(b => b.classList.remove("active"));

      btn.classList.add("active");

      currentSort = btn.dataset.sort;

      render();
    });
  });

document.getElementById("view-grid").onclick = ()=>{

  currentView = "grid";

  document
    .getElementById("view-grid")
    .classList.add("active");

  document
    .getElementById("view-list")
    .classList.remove("active");

  render();
};

document.getElementById("view-list").onclick = ()=>{

  currentView = "list";

  document
    .getElementById("view-list")
    .classList.add("active");

  document
    .getElementById("view-grid")
    .classList.remove("active");

  render();
};

render();
</script>
</body>
</html>
