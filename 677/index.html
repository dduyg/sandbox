<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connected Knowledge Collector Garden</title>
    <style>
        /* --- Minimalist Brutalist Base Styles --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #fafafa;
            color: #111;
            padding: 40px 20px;
        }
        header {
            max-width: 1200px;
            margin: 0 auto 40px auto;
            border-bottom: 1px solid #e5e5e5;
            padding-bottom: 20px;
        }
        h1 {
            font-size: 1.25rem;
            font-weight: 500;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* --- Controls & Search --- */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .search-input {
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 300px;
            font-size: 0.9rem;
            outline: none;
        }
        .search-input:focus {
            border-color: #000;
        }
        .view-switch button {
            background: none;
            border: 1px solid #ccc;
            padding: 6px 12px;
            cursor: pointer;
            font-size: 0.85rem;
            border-radius: 4px;
            margin-left: 5px;
        }
        .view-switch button.active {
            background: #000;
            color: #fff;
            border-color: #000;
        }

        /* --- Section Dividers --- */
        .section-title {
            max-width: 1200px;
            margin: 40px auto 20px auto;
            font-size: 0.9rem;
            text-transform: uppercase;
            color: #666;
            letter-spacing: 0.05em;
        }
        .resonance-divider {
            max-width: 1200px;
            margin: 60px auto 20px auto;
            border: 0;
            border-top: 1px dashed #bbb;
        }

        /* --- Dynamic Container Layouts --- */
        .archive-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* --- GRID VIEW MODE --- */
        .archive-container[data-view="grid"] {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
        }
        .archive-container[data-view="grid"] .fragment-block {
            border: 1px solid #e5e5e5;
            background: #fff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 320px;
            border-radius: 4px;
            transition: transform 0.2s ease;
        }
        .archive-container[data-view="grid"] .fragment-block:hover {
            transform: translateY(-2px);
            border-color: #b5b5b5;
        }
        .archive-container[data-view="grid"] .fragment-content {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow: hidden;
            font-size: 0.95rem;
            line-height: 1.5;
        }
        .archive-container[data-view="grid"] .fragment-content pre {
            background: #f4f4f4;
            padding: 10px;
            width: 100%;
            overflow-x: auto;
            font-size: 0.8rem;
            text-align: left;
        }
        .archive-container[data-view="grid"] .fragment-content img {
            max-width: 100%;
            max-height: 220px;
            object-fit: cover;
        }
        .archive-container[data-view="grid"] .fragment-caption {
            padding: 10px 16px;
            font-size: 0.8rem;
            color: #666;
            border-top: 1px solid #f5f5f5;
            background: #fafafa;
        }

        /* --- TABLE VIEW MODE --- */
        .archive-container[data-view="table"] {
            display: table;
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            border: 1px solid #e5e5e5;
        }
        .archive-container[data-view="table"] .fragment-block {
            display: table-row;
            border-bottom: 1px solid #e5e5e5;
        }
        .archive-container[data-view="table"] .fragment-block:hover {
            background-color: #fcfcfcfc;
        }
        .archive-container[data-view="table"] .fragment-content {
            display: table-cell;
            padding: 12px 20px;
            font-size: 0.9rem;
            max-width: 500px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            vertical-align: middle;
        }
        .archive-container[data-view="table"] .fragment-content pre {
            display: inline;
            background: none;
            padding: 0;
            font-family: inherit;
        }
        .archive-container[data-view="table"] .fragment-content img {
            width: 30px;
            height: 30px;
            object-fit: cover;
            vertical-align: middle;
            margin-right: 10px;
        }
        .archive-container[data-view="table"] .fragment-caption {
            display: table-cell;
            padding: 12px 20px;
            font-size: 0.85rem;
            color: #666;
            text-align: right;
            vertical-align: middle;
        }

        /* --- Resonance Styling Tweaks --- */
        #resonance-field-container .fragment-block {
            opacity: 0.85;
        }
        .empty-notice {
            color: #999;
            font-style: italic;
            font-size: 0.9rem;
            grid-column: 1 / -1;
            padding: 20px 0;
        }
    </style>
</head>
<body>

    <header>
        <h1>Saint Catalog // Knowledge Garden</h1>
        <div class="controls">
            <input type="text" id="search-bar" class="search-input" placeholder="Search archive tags, titles, text...">
            <div class="view-switch">
                <button id="view-grid" class="active">Grid</button>
                <button id="view-table">Table</button>
            </div>
        </div>
    </header>

    <div class="section-title" id="primary-title">All Fragments</div>
    <main id="primary-container" class="archive-container" data-view="grid"></main>

    <hr class="resonance-divider">

    <div class="section-title">Resonance Field (Connected Knowledge)</div>
    <section id="resonance-field-container" class="archive-container" data-view="grid"></section>

    <script>
        // 1. Raw Fragment Database JSON
        const archiveData = [
            {
                id: "f062cb72",
                title: "metrics",
                type: "code",
                content: `{\n  "edge_density": 0.0259,\n  "entropy": 4.6767,\n  "texture": 1.2536,\n  "contrast": 1.0,\n  "circularity": 0.027\n}`,
                tags: ["data", "metrics", "geometry", "code"],
                date: "2026-06-07"
            },
            {
                id: "a189bc34",
                title: "workaholic architect 👩‍🎨",
                type: "text",
                content: "During a downpour, a workaholic architect grabs the wrong umbrella from a café. Inside, she finds love letters someone's been too scared to send. She's determined to find him and play cupid—unaware he's her annoying neighbor.",
                tags: ["fiction", "narrative", "architecture", "urban"],
                date: "2026-05-15"
            },
            {
                id: "c982dd11",
                title: "A lion still has claws",
                type: "text",
                content: "In a coat of gold or a coat of red\nA lion still has claws\nMine are long and sharp, my lord\nAs long and sharp as yours\n\n'And who are you?'\nThe proud Lord said...",
                tags: ["poetry", "narrative", "power"],
                date: "2026-06-05"
            },
            {
                id: "e441aa90",
                title: "Visual Reference Placeholder",
                type: "image",
                content: "https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=500&auto=format&fit=crop&q=60",
                tags: ["visual", "nature", "geometry"],
                date: "2026-04-20"
            }
        ];

        // 2. DOM Elements
        const searchBar = document.getElementById('search-bar');
        const primaryContainer = document.getElementById('primary-container');
        const resonanceContainer = document.getElementById('resonance-field-container');
        const viewGridBtn = document.getElementById('view-grid');
        const viewTableBtn = document.getElementById('view-table');
        const primaryTitle = document.getElementById('primary-title');

        let currentView = 'grid';

        // 3. Render Engine
        function createBlockElement(item) {
            const block = document.createElement('div');
            block.className = 'fragment-block';
            
            let contentHtml = '';
            if (item.type === 'code') {
                contentHtml = `<pre><code>${escapeHtml(item.content)}</code></pre>`;
            } else if (item.type === 'image') {
                contentHtml = `<img src="${item.content}" alt="${item.title}">`;
            } else {
                contentHtml = `<p>${escapeHtml(item.content).replace(/\n/g, '<br>')}</p>`;
            }

            block.innerHTML = `
                <div class="fragment-content">
                    ${contentHtml}
                </div>
                <div class="fragment-caption">
                    ${item.title}
                </div>
            `;
            return block;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // 4. Algorithmic Resonance Matcher
        function calculateResonanceScore(activeResults, candidateItem) {
            // If the candidate item is already showing in active search results, skip it
            if (activeResults.some(r => r.id === candidateItem.id)) return 0;

            let score = 0;

            activeResults.forEach(active => {
                // Axis 1: Shared Meta Tags (High Weight)
                const sharedTags = active.tags.filter(t => candidateItem.tags.includes(t));
                score += sharedTags.length * 5;

                // Axis 2: Temporal Proximity (Medium Weight)
                const timeDiff = Math.abs(new Date(active.date) - new Date(candidateItem.date));
                const daysDiff = timeDiff / (1000 * 60 * 60 * 24);
                if (daysDiff <= 7) score += 3;
                else if (daysDiff <= 30) score += 1;

                // Axis 3: Structural Format Synergy
                if (active.type === candidateItem.type) score += 1;
            });

            return score;
        }

        // 5. Query Handling and Engine Run
        function processGarden() {
            const query = searchBar.value.toLowerCase().trim();
            primaryContainer.innerHTML = '';
            resonanceContainer.innerHTML = '';

            let activeResults = [];

            // Execute Basic Filter
            if (query === '') {
                activeResults = [...archiveData];
                primaryTitle.textContent = "All Fragments";
            } else {
                activeResults = archiveData.filter(item => 
                    item.title.toLowerCase().includes(query) ||
                    item.content.toLowerCase().includes(query) ||
                    item.tags.some(t => t.toLowerCase().includes(query))
                );
                primaryTitle.textContent = `Search Results (${activeResults.length})`;
            }

            // Render Active Layer
            if (activeResults.length === 0) {
                primaryContainer.innerHTML = `<div class="empty-notice">No exact matches found.</div>`;
            } else {
                activeResults.forEach(item => {
                    primaryContainer.appendChild(createBlockElement(item));
                });
            }

            // Process and Render Resonance Layer
            if (query !== '' && activeResults.length > 0) {
                const resonanceList = archiveData
                    .map(item => ({
                        item: item,
                        score: calculateResonanceScore(activeResults, item)
                    }))
                    .filter(res => res.score > 0)
                    .sort((a, b) => b.score - a.score);

                if (resonanceList.length === 0) {
                    resonanceContainer.innerHTML = `<div class="empty-notice">No nearby nodes activating.</div>`;
                } else {
                    resonanceList.forEach(res => {
                        const block = createBlockElement(res.item);
                        // Visual tag showing connectivity depth
                        block.querySelector('.fragment-caption').innerHTML += ` <span style="float:right; opacity:0.5;">⚡ ${res.score}</span>`;
                        resonanceContainer.appendChild(block);
                    });
                }
            } else {
                resonanceContainer.innerHTML = `<div class="empty-notice">Search for a term to initialize co-activation mappings.</div>`;
            }
        }

        // 6. Global Switchers
        function setViewMode(mode) {
            currentView = mode;
            primaryContainer.setAttribute('data-view', mode);
            resonanceContainer.setAttribute('data-view', mode);
            
            viewGridBtn.classList.toggle('active', mode === 'grid');
            viewTableBtn.classList.toggle('active', mode === 'table');
        }

        // 7. Event Listeners
        searchBar.addEventListener('input', processGarden);
        viewGridBtn.addEventListener('click', () => setViewMode('grid'));
        viewTableBtn.addEventListener('click', () => setViewMode('table'));

        // Initial Seed Setup
        window.addEventListener('DOMContentLoaded', () => {
            processGarden();
        });
    </script>
</body>
</html>
