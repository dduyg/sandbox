<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ＮＡＭＥＤＲＯＰ — Name Archive</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Orbitron:wght@400;700;900&family=Noto+Serif+JP:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #800080;
    --bg2: #6e006e;
    --bg3: #5a005a;
    --text: #ff00ff;
    --text-dim: rgba(255,0,255,0.5);
    --text-bright: #ffffff;
    --border: rgba(255,0,255,0.28);
    --border-strong: rgba(255,0,255,0.6);
    --glow: 0 0 20px rgba(255,0,255,0.55);
    --glow-sm: 0 0 8px rgba(255,0,255,0.35);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Space Mono', monospace;
    background-color: #800080;
    color: #ff00ff;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: radial-gradient(rgba(255,0,255,0.09) 1px, transparent 1px);
    background-size: 26px 26px;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 1300px;
    margin: 0 auto;
    padding: 0 28px;
  }

  header {
    padding: 52px 0 32px;
    text-align: center;
  }

  .header-eyebrow {
    font-family: 'Noto Serif JP', serif;
    font-size: 10px;
    letter-spacing: 7px;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 14px;
  }

  .header-title {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(30px, 6vw, 62px);
    font-weight: 900;
    letter-spacing: 10px;
    color: #fff;
    text-shadow: 0 0 32px rgba(255,0,255,0.9), 0 0 80px rgba(255,0,255,0.4);
    line-height: 1;
    margin-bottom: 10px;
  }

  .header-jp {
    font-family: 'Noto Serif JP', serif;
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 5px;
    margin-bottom: 22px;
  }

  .header-stats {
    display: flex;
    justify-content: center;
    gap: 36px;
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  .stat-val { color: #fff; font-weight: 700; }

  .divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--border-strong), transparent);
    margin: 28px 0;
  }

  .search-wrap {
    position: relative;
    max-width: 560px;
    margin: 0 auto 28px;
  }

  .search-input {
    width: 100%;
    background: var(--bg2);
    border: 1px solid var(--border);
    padding: 13px 44px 13px 18px;
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    color: var(--text);
    outline: none;
    letter-spacing: 1px;
    transition: border-color 0.2s, box-shadow 0.2s;
    -webkit-appearance: none;
    border-radius: 0;
  }
  .search-input::placeholder { color: var(--text-dim); }
  .search-input:focus { border-color: var(--text); box-shadow: var(--glow); }

  .search-icon {
    position: absolute;
    right: 14px; top: 50%;
    transform: translateY(-50%);
    color: var(--text-dim);
    font-size: 18px;
    pointer-events: none;
  }

  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .toolbar-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

  .result-count {
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 2px;
    white-space: nowrap;
    text-transform: uppercase;
  }
  .result-count span { color: #fff; }

  /* Custom sort — consistent across all devices */
  .sort-wrap { position: relative; }

  .sort-trigger {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text);
    background: var(--bg2);
    border: 1px solid var(--border);
    padding: 9px 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: border-color 0.2s;
    white-space: nowrap;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .sort-trigger:hover { border-color: var(--text); }
  .sort-trigger .arr { font-size: 8px; opacity: 0.5; transition: transform 0.2s; }
  .sort-trigger.open .arr { transform: rotate(180deg); }

  .sort-dropdown {
    position: absolute;
    top: calc(100% + 3px);
    left: 0;
    background: var(--bg3);
    border: 1px solid var(--border-strong);
    box-shadow: var(--glow);
    z-index: 50;
    min-width: 160px;
    display: none;
  }
  .sort-dropdown.open { display: block; }

  .sort-option {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-dim);
    padding: 11px 14px;
    cursor: pointer;
    transition: all 0.14s;
    white-space: nowrap;
    border-left: 2px solid transparent;
    -webkit-tap-highlight-color: transparent;
  }
  .sort-option:hover { color: #fff; background: rgba(255,0,255,0.1); }
  .sort-option.active { color: #fff; border-left-color: var(--text); }

  .btn {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    padding: 9px 16px;
    border: 1px solid var(--border);
    cursor: pointer;
    transition: all 0.18s;
    text-transform: uppercase;
    background: transparent;
    color: var(--text);
    border-radius: 0;
    white-space: nowrap;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:hover { border-color: var(--text); background: rgba(255,0,255,0.1); box-shadow: var(--glow-sm); }

  .btn-primary {
    background: rgba(255,0,255,0.14);
    border-color: var(--border-strong);
    color: #fff;
  }
  .btn-primary:hover { background: rgba(255,0,255,0.28); box-shadow: var(--glow); }

  .view-toggle { display: flex; }
  .view-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 9px 13px;
    cursor: pointer;
    font-size: 14px;
    transition: all 0.18s;
    font-family: 'Space Mono', monospace;
    -webkit-tap-highlight-color: transparent;
  }
  .view-btn + .view-btn { border-left: none; }
  .view-btn.active { color: #fff; border-color: var(--border-strong); background: rgba(255,0,255,0.12); }

  /* Filter panel */
  .filter-panel {
    background: var(--bg2);
    border: 1px solid var(--border);
    padding: 24px;
    margin-bottom: 22px;
    display: none;
  }
  .filter-panel.open { display: block; }

  .filter-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 20px;
    margin-bottom: 20px;
  }

  .filter-group label {
    display: block;
    font-size: 9px;
    letter-spacing: 3px;
    color: rgba(255,255,255,0.45);
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .filter-chips { display: flex; flex-wrap: wrap; gap: 6px; }

  .chip {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 1px;
    padding: 5px 10px;
    border: 1px solid var(--border);
    cursor: pointer;
    color: var(--text-dim);
    background: transparent;
    transition: all 0.14s;
    white-space: nowrap;
    border-radius: 0;
    -webkit-tap-highlight-color: transparent;
  }
  .chip:hover { border-color: var(--text); color: var(--text); }
  .chip.active { background: rgba(255,0,255,0.18); border-color: var(--text); color: #fff; }

  .filter-actions {
    display: flex;
    gap: 10px;
    align-items: center;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    flex-wrap: wrap;
  }

  .active-filters { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; }

  .active-filter-tag {
    font-size: 9px;
    padding: 4px 10px;
    background: rgba(255,0,255,0.1);
    border: 1px solid var(--border-strong);
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    letter-spacing: 1px;
    -webkit-tap-highlight-color: transparent;
  }
  .active-filter-tag:hover { background: rgba(255,0,255,0.22); color: #fff; }

  /* Grid */
  .names-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
    gap: 14px;
    margin-bottom: 48px;
  }

  /* List */
  .names-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-bottom: 48px;
  }

  /* Grid card */
  .name-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    padding: 20px;
    cursor: pointer;
    transition: border-color 0.18s, box-shadow 0.18s, transform 0.18s;
    display: flex;
    flex-direction: column;
    gap: 12px;
    position: relative;
    overflow: hidden;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .name-card:hover {
    border-color: var(--border-strong);
    box-shadow: var(--glow);
    transform: translateY(-2px);
  }
  .name-card.copied-flash { background: rgba(255,0,255,0.22) !important; transition: none; }

  .card-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 1px;
    color: #fff;
    line-height: 1.35;
  }

  .card-meta { display: flex; gap: 7px; flex-wrap: wrap; }

  .badge {
    font-size: 9px;
    letter-spacing: 1.5px;
    padding: 3px 7px;
    text-transform: uppercase;
    font-weight: 700;
    border: 1px solid;
  }
  .badge-category { color: #fff; border-color: rgba(255,255,255,0.35); background: rgba(255,255,255,0.08); }
  .badge-mood     { color: var(--text); border-color: var(--border); background: rgba(255,0,255,0.1); }
  .badge-style    { color: rgba(255,200,255,1); border-color: rgba(255,200,255,0.3); background: rgba(255,200,255,0.07); }
  .badge-length   { color: var(--text-dim); border-color: var(--border); background: transparent; font-size: 8px; }

  .card-tags { display: flex; flex-wrap: wrap; gap: 5px; }
  .tag { font-size: 9px; color: var(--text-dim); letter-spacing: 1px; }

  .card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid var(--border);
    padding-top: 10px;
    font-size: 9px;
    color: var(--text-dim);
    letter-spacing: 2px;
  }

  .copy-hint {
    font-size: 9px;
    color: var(--text-dim);
    letter-spacing: 1px;
    text-transform: uppercase;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .name-card:hover .copy-hint { opacity: 1; }

  /* List item — title + ID ONLY */
  .list-item {
    background: var(--bg2);
    border: 1px solid var(--border);
    padding: 13px 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    transition: border-color 0.15s, box-shadow 0.15s;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .list-item:hover { border-color: var(--border-strong); box-shadow: var(--glow-sm); }
  .list-item.copied-flash { background: rgba(255,0,255,0.2) !important; transition: none; }

  .list-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 13px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 1px;
    flex: 1;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .list-id {
    font-size: 9px;
    color: var(--text-dim);
    letter-spacing: 2px;
    flex-shrink: 0;
  }

  .empty-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 80px 20px;
    color: var(--text-dim);
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  /* Modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(60,0,60,0.82);
    backdrop-filter: blur(6px);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }

  .modal {
    background: var(--bg3);
    border: 1px solid var(--border-strong);
    padding: 32px;
    width: 100%;
    max-width: 520px;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 0 60px rgba(255,0,255,0.25);
    transform: translateY(18px);
    transition: transform 0.25s;
  }
  .modal-overlay.open .modal { transform: translateY(0); }

  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 28px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }

  .modal-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 13px;
    letter-spacing: 4px;
    color: #fff;
    text-transform: uppercase;
  }

  .modal-close {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 18px;
    cursor: pointer;
    transition: color 0.18s;
    line-height: 1;
    padding: 2px 4px;
  }
  .modal-close:hover { color: #fff; }

  .form-group { margin-bottom: 18px; }

  .form-label {
    display: block;
    font-size: 9px;
    letter-spacing: 3px;
    color: rgba(255,255,255,0.45);
    text-transform: uppercase;
    margin-bottom: 7px;
  }

  .form-input {
    width: 100%;
    background: var(--bg2);
    border: 1px solid var(--border);
    padding: 10px 14px;
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    color: var(--text);
    outline: none;
    transition: border-color 0.18s, box-shadow 0.18s;
    border-radius: 0;
    -webkit-appearance: none;
  }
  .form-input:focus { border-color: var(--text); box-shadow: var(--glow-sm); }
  .form-input::placeholder { color: var(--text-dim); }
  .form-input[readonly] { opacity: 0.4; cursor: default; }

  .form-hint {
    font-size: 9px;
    color: var(--text-dim);
    margin-top: 5px;
    letter-spacing: 1px;
  }

  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

  .modal-footer {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
  }

  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--bg3);
    border: 1px solid var(--border-strong);
    padding: 11px 20px;
    font-size: 10px;
    color: #fff;
    letter-spacing: 2px;
    text-transform: uppercase;
    z-index: 200;
    transform: translateY(60px);
    opacity: 0;
    transition: all 0.25s;
    box-shadow: var(--glow);
  }
  .toast.show { transform: translateY(0); opacity: 1; }

  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: var(--bg3); }
  ::-webkit-scrollbar-thumb { background: rgba(255,0,255,0.4); }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,0,255,0.7); }

  @media (max-width: 520px) {
    .form-row { grid-template-columns: 1fr; }
    .header-stats { gap: 18px; }
  }
</style>
</head>
<body>
<div class="container">

  <header>
    <div class="header-eyebrow">ネームドロップ · データベース · アーカイブ</div>
    <h1 class="header-title">ＮＡＭＥＤＲＯＰ</h1>
    <div class="header-jp">名前のアーカイブ — Name Archive System</div>
    <div class="header-stats">
      <span>ENTRIES <span class="stat-val" id="total-count">0</span></span>
      <span>FILTERED <span class="stat-val" id="filtered-count">0</span></span>
      <span>TAGS <span class="stat-val" id="tag-count">0</span></span>
    </div>
  </header>

  <div class="divider"></div>

  <div class="search-wrap">
    <input type="text" class="search-input" id="search-input" placeholder="SEARCH NAMES, TAGS, MOODS...">
    <span class="search-icon">⌕</span>
  </div>

  <div class="toolbar">
    <div class="toolbar-left">
      <button class="btn" id="filter-toggle">⊞ FILTERS</button>
      <div class="sort-wrap">
        <div class="sort-trigger" id="sort-trigger">
          <span id="sort-label">SORT: DEFAULT</span>
          <span class="arr">▼</span>
        </div>
        <div class="sort-dropdown" id="sort-dropdown">
          <div class="sort-option active" data-val="default">Default</div>
          <div class="sort-option" data-val="alpha-asc">A → Z</div>
          <div class="sort-option" data-val="alpha-desc">Z → A</div>
          <div class="sort-option" data-val="length-asc">Word Count ↑</div>
          <div class="sort-option" data-val="length-desc">Word Count ↓</div>
          <div class="sort-option" data-val="newest">Newest First</div>
        </div>
      </div>
      <span class="result-count">SHOWING <span id="filtered-count-inline">0</span> OF <span id="total-count-inline">0</span></span>
    </div>
    <div style="display:flex;gap:8px;align-items:center;">
      <div class="view-toggle">
        <button class="view-btn active" id="view-grid" title="Grid">⊞</button>
        <button class="view-btn" id="view-list" title="List">☰</button>
      </div>
      <button class="btn btn-primary" id="add-btn">+ ADD ENTRY</button>
    </div>
  </div>

  <div class="filter-panel" id="filter-panel">
    <div class="filter-grid">
      <div class="filter-group">
        <label>Category</label>
        <div class="filter-chips" id="filter-category"></div>
      </div>
      <div class="filter-group">
        <label>Mood</label>
        <div class="filter-chips" id="filter-mood"></div>
      </div>
      <div class="filter-group">
        <label>Style</label>
        <div class="filter-chips" id="filter-style"></div>
      </div>
      <div class="filter-group">
        <label>Length</label>
        <div class="filter-chips" id="filter-length"></div>
      </div>
    </div>
    <div class="divider" style="margin:0 0 16px;"></div>
    <div class="filter-group">
      <label>Tags</label>
      <div class="filter-chips" id="filter-tags"></div>
    </div>
    <div class="filter-actions">
      <div class="active-filters" id="active-filters"></div>
      <button class="btn" id="clear-filters">✕ CLEAR ALL</button>
    </div>
  </div>

  <div id="names-container" class="names-grid"></div>

</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">NEW ENTRY</span>
      <button class="modal-close" id="modal-close">✕</button>
    </div>

    <div class="form-group">
      <label class="form-label">Title *</label>
      <input type="text" class="form-input" id="form-title" placeholder="e.g. Synthetic Entrance" autocomplete="off">
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Category *</label>
        <input type="text" class="form-input" id="form-category" placeholder="e.g. Atmospheric" autocomplete="off" list="cat-list">
        <datalist id="cat-list"></datalist>
        <div class="form-hint">Type freely or pick existing</div>
      </div>
      <div class="form-group">
        <label class="form-label">Mood *</label>
        <input type="text" class="form-input" id="form-mood" placeholder="e.g. Dreamy" autocomplete="off" list="mood-list">
        <datalist id="mood-list"></datalist>
        <div class="form-hint">Type freely or pick existing</div>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Style</label>
        <input type="text" class="form-input" id="form-style" placeholder="e.g. Glitch" autocomplete="off" list="style-list">
        <datalist id="style-list"></datalist>
        <div class="form-hint">Type freely or pick existing</div>
      </div>
      <div class="form-group">
        <label class="form-label">Length</label>
        <input type="text" class="form-input" id="form-length" placeholder="Auto-calculated" readonly>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Tags <span style="opacity:0.45">(comma-separated)</span></label>
      <input type="text" class="form-input" id="form-tags" placeholder="cyber, retro, nostalgia" autocomplete="off">
    </div>

    <div class="modal-footer">
      <button class="btn" id="modal-cancel">CANCEL</button>
      <button class="btn btn-primary" id="modal-save">SAVE ENTRY</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════════
// DATASET
// ═══════════════════════════════════════════
const DB = [
  { id:1,  title:"Synthetic Entrance",     category:"Technical",     mood:"Mysterious",  style:"Creative",     tags:["cyber","tech","entry"],              added:1744070400000 },
  { id:2,  title:"Cherry Cola Skies",      category:"Atmospheric",   mood:"Dreamy",      style:"Casual",       tags:["retro","sky","pastel","nostalgia"],   added:1744156800000 },
  { id:3,  title:"Counting Constellations",category:"Atmospheric",   mood:"Melancholic", style:"Creative",     tags:["space","night","poetic"],             added:1744243200000 },

// User-added entries live here in memory
let userEntries = [];
let nextId = DB.length + 1;
let currentView = 'grid';
let sortVal = 'default';
let activeFilters = { category:[], mood:[], style:[], length:[], tags:[] };

// ═══════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════
const allEntries = () => [...DB, ...userEntries];

function getLength(title) {
  const w = title.trim().split(/\s+/).length;
  if (w <= 2) return 'Short';
  if (w === 3) return 'Medium';
  return 'Long';
}

function getUniqueValues(field) {
  return [...new Set(allEntries().map(e => e[field]).filter(Boolean))].sort();
}

function getAllTags() {
  const s = new Set();
  allEntries().forEach(e => (e.tags||[]).forEach(t => s.add(t)));
  return [...s].sort();
}

// ═══════════════════════════════════════════
// DATALIST (autocomplete suggestions)
// ═══════════════════════════════════════════
function refreshDataLists() {
  const fill = (id, vals) => {
    const dl = document.getElementById(id);
    if (dl) dl.innerHTML = vals.map(v => `<option value="${v}">`).join('');
  };
  fill('cat-list',   getUniqueValues('category'));
  fill('mood-list',  getUniqueValues('mood'));
  fill('style-list', getUniqueValues('style'));
}

// ═══════════════════════════════════════════
// FILTER CHIPS
// ═══════════════════════════════════════════
function buildFilterChips() {
  const make = (containerId, vals, key) => {
    const wrap = document.getElementById(containerId);
    if (!wrap) return;
    wrap.innerHTML = '';
    vals.forEach(val => {
      const b = document.createElement('button');
      b.className = 'chip' + (activeFilters[key].includes(val) ? ' active' : '');
      b.textContent = val;
      b.onclick = () => toggleFilter(key, val);
      wrap.appendChild(b);
    });
  };

  make('filter-category', getUniqueValues('category'), 'category');
  make('filter-mood',     getUniqueValues('mood'),     'mood');
  make('filter-style',    getUniqueValues('style'),    'style');
  make('filter-length',   ['Short', 'Medium', 'Long)'], 'length');

  const tw = document.getElementById('filter-tags');
  tw.innerHTML = '';
  getAllTags().forEach(tag => {
    const b = document.createElement('button');
    b.className = 'chip' + (activeFilters.tags.includes(tag) ? ' active' : '');
    b.textContent = '#' + tag;
    b.onclick = () => toggleFilter('tags', tag);
    tw.appendChild(b);
  });
}

function toggleFilter(type, val) {
  const arr = activeFilters[type];
  const i = arr.indexOf(val);
  if (i >= 0) arr.splice(i, 1); else arr.push(val);
  buildFilterChips();
  renderActiveFilters();
  render();
}

function renderActiveFilters() {
  const wrap = document.getElementById('active-filters');
  wrap.innerHTML = '';
  Object.entries(activeFilters).forEach(([type, vals]) => {
    vals.forEach(val => {
      const tag = document.createElement('div');
      tag.className = 'active-filter-tag';
      tag.innerHTML = `<span>${type}: ${val}</span><span>✕</span>`;
      tag.onclick = () => toggleFilter(type, val);
      wrap.appendChild(tag);
    });
  });
}

// ═══════════════════════════════════════════
// FILTER + SORT
// ═══════════════════════════════════════════
function getFiltered() {
  const q = document.getElementById('search-input').value.toLowerCase().trim();
  let items = allEntries().filter(e => {
    if (q) {
      const h = [e.title, e.category, e.mood, e.style, ...(e.tags||[])].join(' ').toLowerCase();
      if (!h.includes(q)) return false;
    }
    if (activeFilters.category.length && !activeFilters.category.includes(e.category)) return false;
    if (activeFilters.mood.length     && !activeFilters.mood.includes(e.mood))          return false;
    if (activeFilters.style.length    && !activeFilters.style.includes(e.style))        return false;
    if (activeFilters.length.length   && !activeFilters.length.includes(getLength(e.title))) return false;
    if (activeFilters.tags.length     && !activeFilters.tags.some(t => (e.tags||[]).includes(t))) return false;
    return true;
  });

  if      (sortVal === 'alpha-asc')   items.sort((a,b) => a.title.localeCompare(b.title));
  else if (sortVal === 'alpha-desc')  items.sort((a,b) => b.title.localeCompare(a.title));
  else if (sortVal === 'length-asc')  items.sort((a,b) => a.title.split(/\s+/).length - b.title.split(/\s+/).length);
  else if (sortVal === 'length-desc') items.sort((a,b) => b.title.split(/\s+/).length - a.title.split(/\s+/).length);
  else if (sortVal === 'newest')      items.sort((a,b) => b.added - a.added);

  return items;
}

// ═══════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════
function render() {
  const items = getFiltered();
  const total = allEntries().length;

  document.getElementById('total-count').textContent         = total;
  document.getElementById('filtered-count').textContent      = items.length;
  document.getElementById('filtered-count-inline').textContent = items.length;
  document.getElementById('total-count-inline').textContent  = total;
  document.getElementById('tag-count').textContent           = getAllTags().length;

  const container = document.getElementById('names-container');

  if (currentView === 'list') {
    container.className = 'names-list';
    if (!items.length) {
      container.innerHTML = '<div class="empty-state">No entries match</div>';
      return;
    }
    // List view: title + ID only
    container.innerHTML = items.map(e => `
      <div class="list-item" onclick="copyItem(this,'${e.title.replace(/\\/g,'\\\\').replace(/'/g,"\\'")}')">
        <div class="list-title">${e.title}</div>
        <div class="list-id">ID·${String(e.id).padStart(4,'0')}</div>
      </div>
    `).join('');

  } else {
    container.className = 'names-grid';
    if (!items.length) {
      container.innerHTML = '<div class="empty-state">No entries match your filters</div>';
      return;
    }
    container.innerHTML = items.map(e => {
      const tags = (e.tags||[]).map(t=>`<span class="tag">#${t}</span>`).join('');
      return `
        <div class="name-card" onclick="copyItem(this,'${e.title.replace(/\\/g,'\\\\').replace(/'/g,"\\'")}')">
          <div class="card-title">${e.title}</div>
          <div class="card-meta">
            <span class="badge badge-category">${e.category}</span>
            <span class="badge badge-mood">${e.mood}</span>
            ${e.style ? `<span class="badge badge-style">${e.style}</span>` : ''}
          </div>
          ${tags ? `<div class="card-tags">${tags}</div>` : ''}
          <div class="card-footer">
            <span class="list-id">ID·${String(e.id).padStart(4,'0')}</span>
            <span class="badge badge-length">${getLength(e.title)}</span>
            <span class="copy-hint">click to copy</span>
          </div>
        </div>
      `;
    }).join('');
  }

  buildFilterChips();
}

// ═══════════════════════════════════════════
// COPY ON CLICK
// ═══════════════════════════════════════════
function copyItem(el, title) {
  navigator.clipboard.writeText(title).catch(() => {});
  el.classList.add('copied-flash');
  setTimeout(() => el.classList.remove('copied-flash'), 350);
  showToast('COPIED — ' + title);
}

// ═══════════════════════════════════════════
// MODAL
// ═══════════════════════════════════════════
function openModal() {
  refreshDataLists();
  document.getElementById('modal-overlay').classList.add('open');
  setTimeout(() => document.getElementById('form-title').focus(), 200);
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  ['form-title','form-category','form-mood','form-style','form-length','form-tags']
    .forEach(id => { document.getElementById(id).value = ''; });
}

function saveEntry() {
  const title    = document.getElementById('form-title').value.trim();
  const category = document.getElementById('form-category').value.trim();
  const mood     = document.getElementById('form-mood').value.trim();
  const style    = document.getElementById('form-style').value.trim();
  const tagsRaw  = document.getElementById('form-tags').value.trim();

  if (!title)    { showToast('TITLE IS REQUIRED');    return; }
  if (!category) { showToast('CATEGORY IS REQUIRED'); return; }
  if (!mood)     { showToast('MOOD IS REQUIRED');     return; }

  const tags = tagsRaw ? tagsRaw.split(',').map(t => t.trim().toLowerCase()).filter(Boolean) : [];
  userEntries.push({ id: nextId++, title, category, mood, style, tags, added: Date.now() });
  showToast('ADDED — ' + title);
  closeModal();
  render();
}

// ═══════════════════════════════════════════
// TOAST
// ═══════════════════════════════════════════
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 2200);
}

// ═══════════════════════════════════════════
// SORT CUSTOM DROPDOWN
// ═══════════════════════════════════════════
const sortLabels = {
  'default':     'SORT: DEFAULT',
  'alpha-asc':   'SORT: A → Z',
  'alpha-desc':  'SORT: Z → A',
  'length-asc':  'SORT: LENGTH ↑',
  'length-desc': 'SORT: LENGTH ↓',
  'newest':      'SORT: NEWEST',
};

const sortTrigger   = document.getElementById('sort-trigger');
const sortDropdown  = document.getElementById('sort-dropdown');
const sortLabelEl   = document.getElementById('sort-label');

sortTrigger.onclick = e => {
  e.stopPropagation();
  const open = sortDropdown.classList.toggle('open');
  sortTrigger.classList.toggle('open', open);
};

document.querySelectorAll('.sort-option').forEach(opt => {
  opt.onclick = () => {
    sortVal = opt.dataset.val;
    sortLabelEl.textContent = sortLabels[sortVal];
    document.querySelectorAll('.sort-option').forEach(o => o.classList.remove('active'));
    opt.classList.add('active');
    sortDropdown.classList.remove('open');
    sortTrigger.classList.remove('open');
    render();
  };
});

document.addEventListener('click', () => {
  sortDropdown.classList.remove('open');
  sortTrigger.classList.remove('open');
});

// ═══════════════════════════════════════════
// EVENTS
// ═══════════════════════════════════════════
document.getElementById('search-input').addEventListener('input', render);

document.getElementById('filter-toggle').onclick = () =>
  document.getElementById('filter-panel').classList.toggle('open');

document.getElementById('clear-filters').onclick = () => {
  activeFilters = { category:[], mood:[], style:[], length:[], tags:[] };
  buildFilterChips();
  renderActiveFilters();
  render();
};

document.getElementById('add-btn').onclick = openModal;
document.getElementById('modal-close').onclick = closeModal;
document.getElementById('modal-cancel').onclick = closeModal;
document.getElementById('modal-save').onclick = saveEntry;

document.getElementById('modal-overlay').onclick = e => {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
};

document.getElementById('form-title').addEventListener('input', () => {
  const v = document.getElementById('form-title').value;
  document.getElementById('form-length').value = v ? getLength(v) : '';
});

document.getElementById('view-grid').onclick = () => {
  currentView = 'grid';
  document.getElementById('view-grid').classList.add('active');
  document.getElementById('view-list').classList.remove('active');
  render();
};

document.getElementById('view-list').onclick = () => {
  currentView = 'list';
  document.getElementById('view-list').classList.add('active');
  document.getElementById('view-grid').classList.remove('active');
  render();
};

// Init
render();
</script>
