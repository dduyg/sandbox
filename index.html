<!DOCTYPE html>  
<html lang="en">  
<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <link rel="shortcut icon" type="image/x-icon" href="https://cdn.jsdelivr.net/gh/dduyg/LiminalLoop@shelf/0-6/favicons/RGB-pinkGrass.ico">  
    <title>Limimal📺Loop</title>  
    <style>  
        body {  
            display: flex;  
            justify-content: center;  
            align-items: center;  
            height: 100vh; margin: 0;  
            background-color: #f5f5f0;  
            font-family: sans-serif;  
        }

        header {
            position: fixed;
            top: 5%; right: 8%;
        }
        #bar {
            position: relative;
            width: 50px; height: 50px;
        }
        #search-input {
            position: absolute;
            top: 0; right: 0;
            width: 50px; height: 50px;
            border: 4px solid #A5B5BB;
            border-radius: 50px;
            background: transparent;
            outline: none;
            color: #A5B5BB;
            font-size: 16px;
            padding: 0; opacity: 0;
            visibility: hidden;
            transition: all 0.4s ease;
            box-sizing: border-box;
        }
        #search-input.active {
            width: 300px;
            padding: 0 55px 0 15px;
            border-radius: 6px;
            opacity: 1;
            visibility: visible;
        }
        #search-input::placeholder {
            color: #7E8E94;
            opacity: 0.9;
        }
        #search-btn {
            position: absolute;
            top: 0; right: 0;
            width: 50px; height: 50px;
            border: none;
            background: transparent;
            cursor: pointer;
            z-index: 2;
        }
        /* Magnifying glass */
        #search-btn::before {
            content: "";
            position: absolute;
            width: 16px; height: 16px;
            border: 4px solid #A5B5BB;
            border-radius: 50%;
            top: 8px; left: 8px;
            transition: 0.3s;
        }
        #search-btn::after {
            content: "";
            position: absolute;
            width: 18px; height: 4px;
            background: #A5B5BB;
            transform: rotate(45deg);
            top: 30px; left: 24px;
            transition: 0.3s;
        }
        #search-btn.close::before {
            width: 26px; height: 4px;
            border: none; border-radius: 0;
            background: #A5B5BB;
            transform: rotate(45deg);
            top: 23px; left: 12px;
        }
        #search-btn.close::after {
            width: 26px;
            transform: rotate(-45deg);
            top: 23px; left: 12px;
        }
        
        .gradient-container {  
            width: 80%;  
            max-width: 600px;  
        }
        .gradient-bar {  
            height: 150px;  
            width: 100%;  
            /* core gradient logic */  
            background: linear-gradient(to right,   
                #00e5b5 0%,    /* Vibrant Cyan -100 */  
                #00e5b5 25%,   /* Hold color to -50 */  
                #94bdb0 45%,   /* Muted Teal/Grey */  
                #bdb0b5 55%,   /* Muted Pink/Grey */  
                #ff82bc 75%,   /* Soft Pink +50 */  
                #ff48c4 100%   /* Bright Magenta 'A' */  
            );  
            border-bottom: 2px solid #333;  
            position: relative;  
        }  
  
        /* Scale Markings */  
        .scale {  
            display: flex;  
            justify-content: space-between;  
            padding-top: 10px;  
            color: #333;  
        }  
  
        /* The center black line with white shadow effect */  
        .center-line {  
            position: absolute;  
            left: 50%; top: 0; bottom: 0;  
            width: 2px;  
            background-color: #333;  
            /* box-shadow values: 
               2px (shifts shadow right) 
               0px (no vertical shift) 
               1px (slight blur for softness) 
               rgba(...) white with 80% opacity 
            */
            box-shadow: 2px 0px 1px rgba(255, 255, 255, 0.8);
        }  
    </style>  
</head>  
<body>
    <header>
        <form id="bar">
            <input type="text" id="search-input" placeholder="Search...">
            <button type="button" id="search-btn"></button>
        </form>
    </header>

    <div class="gradient-container">  
        <div class="gradient-bar"><div class="center-line"></div></div>  
        <div class="scale"><span>-100</span><span>-50</span><span>0</span><span>50</span><span>A</span></div>  
    </div>
    
    <script>
        const input = document.getElementById("search-input");
        const button = document.getElementById("search-btn");

        button.addEventListener("click", () => {

            input.classList.toggle("active");
            button.classList.toggle("close");
            
            if(input.classList.contains("active")){
                input.focus();
            } else {
                input.value = "";
            }
        });
    </script>  
</body>  
</html>
