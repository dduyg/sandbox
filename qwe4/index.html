<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Patterns & Icons — HyperCard-inspired asset library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 24px 16px 80px;
    background: radial-gradient(#000 0.5px, transparent 1px) 0 0/6px 6px, #ccc;
    font-family: 'IBM Plex Mono', monospace;
    color: #000;
  }

  .window {
    max-width: 960px;
    margin: 24px auto;
    background: #fff;
    border: 2px solid #000;
    box-shadow: 6px 6px 0 #000;
  }

  .title-bar {
    height: 30px;
    display: flex;
    align-items: center;
    padding: 0 10px;
    background: repeating-linear-gradient(#000 0 2px, #fff 2px 4px);
    border-bottom: 2px solid #000;
  }

  .close-box { width: 13px; height: 13px; background: #fff; border: 2px solid #000; flex-shrink: 0; }
  .title-text { background: #fff; padding: 2px 12px; font-family: 'Silkscreen', monospace; font-size: 13px; margin: 0 auto; }
  .spacer { width: 13px; flex-shrink: 0; }

  .content { padding: 26px 30px 40px; }

  .intro { max-width: 640px; font-size: 13px; line-height: 1.7; }

  h2 {
    font-family: 'Silkscreen', monospace;
    font-size: 16px;
    font-weight: 400;
    margin: 38px 0 16px;
    padding-bottom: 8px;
    border-bottom: 2px solid #000;
  }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 20px;
    padding: 16px;
    border: 2px solid #000;
    background: repeating-linear-gradient(45deg, #000 0 1px, transparent 1px 6px), repeating-linear-gradient(-45deg, #000 0 1px, transparent 1px 6px), #fff;
  }

  .btn {
    font-family: 'Silkscreen', monospace;
    font-size: 11.5px;
    padding: 10px 14px;
    border: 2px solid #000;
    background: #fff;
    cursor: pointer;
    box-shadow: 3px 3px 0 #000;
  }
  .btn:hover { background: #000; color: #fff; }
  .btn:active { box-shadow: none; transform: translate(3px, 3px); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 14px; }

  .tile {
    border: 2px solid #000;
    background: #fff;
    padding: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    user-select: none;
  }
  .tile:hover { box-shadow: 3px 3px 0 #000; transform: translate(-1px, -1px); }
  .tile:active { box-shadow: none; transform: translate(1px, 1px); }

  .swatch { width: 64px; height: 64px; border: 1px solid #000; }
  .icon-holder { width: 64px; height: 64px; display: flex; align-items: center; justify-content: center; }
  .icon-holder svg { width: 48px; height: 48px; }

  .label { font-size: 10.5px; text-align: center; line-height: 1.3; min-height: 26px; display: flex; align-items: center; }

  footer { margin-top: 40px; padding-top: 16px; border-top: 2px solid #000; font-size: 11.5px; font-style: italic; }
</style>
</head>
<body>

  <div class="window">
    <div class="title-bar">
      <div class="close-box"></div>
      <div class="title-text">Patterns &amp; Icons.stack</div>
      <div class="spacer"></div>
    </div>

    <div class="content">
      <p class="intro">
        A library of 1-bit dither patterns and bitmap-style icons, drawn in the
        spirit of HyperCard's black-and-white toolset. Click any tile to copy
        its CSS or SVG, or grab everything at once below.
      </p>

      <div class="toolbar">
        <button class="btn" id="downloadIconPng">⤓ Icon sprite sheet (PNG)</button>
        <button class="btn" id="downloadIconSvg">⤓ Icon sprite (SVG symbols)</button>
        <button class="btn" id="downloadPatternsCss">⤓ All patterns (CSS)</button>
      </div>

      <h2>Patterns</h2>
      <div class="grid" id="patternGrid"></div>

      <h2>Icons</h2>
      <div class="grid" id="iconGrid"></div>

      <footer>Click any swatch or icon to copy its code to the clipboard.</footer>
    </div>
  </div>

<script>
  function slug(name) { return name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, ""); }

  // ---------- PATTERNS (generated) ----------
  const PATTERNS = [];
  PATTERNS.push({ name: "Solid Black", css: "background:#000;" });
  PATTERNS.push({ name: "Solid White", css: "background:#fff;" });

  const stripeWidths = [1, 2, 4, 8];
  const stripeDirs = [
    { label: "Horizontal", css: w => `background: repeating-linear-gradient(to bottom, #000 0 ${w}px, #fff ${w}px ${w*2}px);` },
    { label: "Vertical", css: w => `background: repeating-linear-gradient(to right, #000 0 ${w}px, #fff ${w}px ${w*2}px);` },
    { label: "Diagonal ↗", css: w => `background: repeating-linear-gradient(45deg, #000 0 ${w}px, #fff ${w}px ${w*2}px);` },
    { label: "Diagonal ↘", css: w => `background: repeating-linear-gradient(-45deg, #000 0 ${w}px, #fff ${w}px ${w*2}px);` }
  ];
  stripeDirs.forEach(dir => stripeWidths.forEach(w => {
    PATTERNS.push({ name: `${dir.label} Stripes ${w}px`, css: dir.css(w) });
  }));

  [4, 8, 16, 32].forEach(size => {
    PATTERNS.push({ name: `Checker ${size}px`, css: `background: repeating-conic-gradient(#000 0% 25%, #fff 0% 50%) 0 0/${size}px ${size}px;` });
  });

  [3, 4, 6, 8, 12, 16].forEach(spacing => {
    PATTERNS.push({ name: `Dots ${spacing}px`, css: `background: radial-gradient(#000 1px, transparent 1.2px) 0 0/${spacing}px ${spacing}px, #fff;` });
    PATTERNS.push({ name: `Dots Inverse ${spacing}px`, css: `background: radial-gradient(#fff 1px, transparent 1.2px) 0 0/${spacing}px ${spacing}px, #000;` });
  });

  [4, 6, 8].forEach(s => {
    PATTERNS.push({ name: `Crosshatch ${s}px`, css: `background: repeating-linear-gradient(45deg, #000 0 1px, transparent 1px ${s}px), repeating-linear-gradient(-45deg, #000 0 1px, transparent 1px ${s}px), #fff;` });
  });

  [4, 8, 12].forEach(s => {
    PATTERNS.push({ name: `Grid Lines ${s}px`, css: `background: repeating-linear-gradient(#000 0 1px, transparent 1px ${s}px), repeating-linear-gradient(90deg, #000 0 1px, transparent 1px ${s}px), #fff;` });
  });

  [2, 4, 6].forEach(t => {
    PATTERNS.push({ name: `Lattice ${t}px`, css: `background: repeating-linear-gradient(0deg, #000 0 ${t}px, transparent ${t}px ${t*2}px), repeating-linear-gradient(90deg, #000 0 ${t}px, transparent ${t}px ${t*2}px), #fff;` });
  });

  PATTERNS.push({ name: "Brick 8px", css: "background: linear-gradient(#000 1px, transparent 1px) 0 0/16px 8px, linear-gradient(90deg,#000 1px, transparent 1px) 0 0/16px 8px, linear-gradient(90deg,#000 1px, transparent 1px) 8px 4px/16px 8px, #fff;" });
  PATTERNS.push({ name: "Brick 16px", css: "background: linear-gradient(#000 1px, transparent 1px) 0 0/32px 16px, linear-gradient(90deg,#000 1px, transparent 1px) 0 0/32px 16px, linear-gradient(90deg,#000 1px, transparent 1px) 16px 8px/32px 16px, #fff;" });

  [[0.4, "12%"], [0.7, "25%"], [1.0, "37%"], [1.3, "50%"], [1.6, "62%"], [1.9, "75%"]].forEach(([r, label]) => {
    PATTERNS.push({ name: `Gray Dither ${label}`, css: `background: radial-gradient(#000 ${r}px, transparent ${r+0.3}px) 0 0/6px 6px, #fff;` });
  });

  // ---------- ICONS ----------
  const ICONS = [

  function copyText(text, labelEl, originalName) {
    navigator.clipboard.writeText(text).then(() => {
      labelEl.textContent = "Copied!";
      setTimeout(() => { labelEl.textContent = originalName; }, 1000);
    }).catch(() => {
      labelEl.textContent = "Copy failed";
      setTimeout(() => { labelEl.textContent = originalName; }, 1000);
    });
  }

  function iconMarkup(icon) {
    return `<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">${icon.body}</svg>`;
  }

  function renderPatterns() {
    const grid = document.getElementById("patternGrid");
    PATTERNS.forEach(p => {
      const tile = document.createElement("div");
      tile.className = "tile";
      const swatch = document.createElement("div");
      swatch.className = "swatch";
      swatch.style.cssText = p.css;
      const label = document.createElement("div");
      label.className = "label";
      label.textContent = p.name;
      tile.appendChild(swatch);
      tile.appendChild(label);
      tile.addEventListener("click", () => copyText(p.css, label, p.name));
      grid.appendChild(tile);
    });
  }

  function renderIcons() {
    const grid = document.getElementById("iconGrid");
    ICONS.forEach(icon => {
      const tile = document.createElement("div");
      tile.className = "tile";
      const svgMarkup = iconMarkup(icon);
      const holder = document.createElement("div");
      holder.className = "icon-holder";
      holder.innerHTML = svgMarkup;
      const label = document.createElement("div");
      label.className = "label";
      label.textContent = icon.name;
      tile.appendChild(holder);
      tile.appendChild(label);
      tile.addEventListener("click", () => copyText(svgMarkup, label, icon.name));
      grid.appendChild(tile);
    });
  }

  function downloadTextFile(content, filename, type) {
    const blob = new Blob([content], { type });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename; a.click();
    URL.revokeObjectURL(url);
  }

  function downloadPatternsCss() {
    const css = PATTERNS.map(p => `.pattern-${slug(p.name)} {\n  ${p.css}\n}`).join("\n\n");
    downloadTextFile(css, "hypercard-patterns.css", "text/css");
  }

  function downloadIconSvgSprite() {
    const symbols = ICONS.map(icon => `<symbol id="icon-${slug(icon.name)}" viewBox="0 0 32 32">${icon.body}</symbol>`).join("\n");
    const sprite = `<svg xmlns="http://www.w3.org/2000/svg" style="display:none">\n${symbols}\n</svg>`;
    downloadTextFile(sprite, "hypercard-icon-sprite.svg", "image/svg+xml");
  }

  function loadImage(svgMarkup) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svgMarkup);
    });
  }

  async function downloadIconPngSheet() {
    const cols = 6;
    const cellSize = 96;
    const iconSize = 64;
    const rows = Math.ceil(ICONS.length / cols);
    const canvas = document.createElement("canvas");
    canvas.width = cols * cellSize;
    canvas.height = rows * cellSize;
    const ctx = canvas.getContext("2d");
    ctx.imageSmoothingEnabled = false;
    ctx.fillStyle = "#fff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = "#000";
    ctx.lineWidth = 2;

    for (let i = 0; i < ICONS.length; i++) {
      const icon = ICONS[i];
      const img = await loadImage(iconMarkup(icon));
      const col = i % cols;
      const row = Math.floor(i / cols);
      const cellX = col * cellSize;
      const cellY = row * cellSize;
      ctx.strokeRect(cellX + 4, cellY + 4, cellSize - 8, cellSize - 8);
      ctx.drawImage(img, cellX + (cellSize - iconSize) / 2, cellY + (cellSize - iconSize) / 2, iconSize, iconSize);
    }

    canvas.toBlob(blob => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = "hypercard-icon-spritesheet.png"; a.click();
      URL.revokeObjectURL(url);
    }, "image/png");
  }

  document.getElementById("downloadIconPng").addEventListener("click", downloadIconPngSheet);
  document.getElementById("downloadIconSvg").addEventListener("click", downloadIconSvgSprite);
  document.getElementById("downloadPatternsCss").addEventListener("click", downloadPatternsCss);

  renderPatterns();
  renderIcons();
</script>
